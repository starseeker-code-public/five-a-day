name: Deploy production

# Arms itself automatically on the LAST of the events a release needs, then
# STOPS and waits for a human. Two-phase by design:
#
#   PHASE 1 (automatic, credential-free)
#   QA signs off on /testing/ (repository_dispatch), the release PR merges
#   into main (push), or the nightly `Deploy testing` completes (workflow_run)
#                 →  preflight: exit green when production already serves
#                    main's version (the common nightly case — silent, no
#                    email); otherwise the provenance gate (the version on main
#                    must carry the testing-vX.Y.Z release tag in its history,
#                    i.e. it arrived via the testing → main PR), then the QA
#                    sign-off gate (testing's /health/?deep=1 must be healthy,
#                    serve THIS version, and report ready_for_prod=true — set
#                    by the "¿Listo para desplegar?" button on /testing/ and
#                    reset by every nightly testing deploy), wait for CI green,
#                    list migrations
#   PHASE 2 (manual approval)
#                 →  deploy: BLOCKED on the `production` environment's required
#                    reviewer. Nothing touches GCP until somebody clicks
#                    "Review deployments → Approve".
#
# The cadence this produces: the nightly deploy puts the release on the VM and
# resets ready_for_prod; then the LAST of {QA's sign-off, the PR merge} arms
# this workflow the moment it happens — same day, no manual dispatch. Those two
# day-time triggers exit GREEN AND QUIET when the other condition is still
# pending ("not yet" is a state, not a fault); the nightly workflow_run
# re-trigger is the strict WATCHDOG that fails loudly while a merged release
# sits unsigned. Production is still never deployed by a timer: every trigger
# only ARMS the deploy, a human always approves. The `/deploy` skill remains
# the by-hand path for emergencies.
#
# If the deploy job fails AFTER it has started changing production (jobs
# repointed / service rolled), a rollback step automatically restores the
# previous image on the service and all Cloud Run jobs. It never touches the
# database — schema/data recovery is a human decision (the pre-deploy backup id
# is in the failure email). rollback-production.yml is the on-demand variant.

on:
  # A release needs three events: (1) the nightly testing deploy puts the
  # version on the VM, (2) QA signs it off on /testing/, (3) the testing → main
  # release PR merges. Because the testing deploy RESETS ready_for_prod, the
  # sign-off always post-dates the deploy — so the LAST event is always the
  # sign-off or the merge, and those two are the arming triggers:
  #
  #   repository_dispatch — the "¿Listo para desplegar?" button (and
  #     `set_ready_for_prod on`) fires `qa-ready-for-prod` via the GitHub API
  #     (core/github_dispatch.py, GITHUB_DISPATCH_TOKEN on the testing VM;
  #     fail-soft, so a missing token just falls back to the nightly cadence).
  #     The event's payload is deliberately IGNORED — preflight re-derives
  #     everything from main's pyproject.toml and testing's /health/?deep=1.
  #   push to main — the release PR merge. Firing on the merge used to be the
  #     ONLY trigger and was removed because a same-day merge always failed the
  #     QA gate loudly (v1.26.5: main merged at 13:36, testing still served
  #     v1.26.2). What makes it safe to reinstate is the trigger-mode split
  #     below: on these two day-time events an unmet gate ends the run GREEN
  #     with a "not armed" summary instead of a red run and an alarm email.
  #   workflow_run — the nightly `Deploy testing` completing. Never the arming
  #     event for a new version (the deploy resets the sign-off); it is the
  #     strict WATCHDOG: a merged release still unsigned by then fails loudly
  #     and emails — deliberate insistence, an unshipped release is a state to
  #     resolve, not to sit in.
  #
  # All of these fire from the workflow file on the DEFAULT branch (main), so
  # trigger edits travel development → testing → main before they change
  # anything (push runs the file as of the pushed commit, so the release that
  # ships a trigger change already merges with it active).
  workflow_run:
    workflows: ["Deploy testing"]
    types: [completed]
  push:
    branches: [main]
  repository_dispatch:
    types: [qa-ready-for-prod]
  workflow_dispatch:
    inputs:
      force:
        description: 'Deploy even when production already serves this version, bypassing the testing sign-off gate (emergencies only)'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  checks: read   # the preflight job polls check runs on the commit

env:
  GCP_PROJECT: five-a-day-evolution
  GCP_REGION: europe-southwest1
  SERVICE: fiveaday
  SQL_INSTANCE: fiveaday-db
  IMAGE_BASE: europe-southwest1-docker.pkg.dev/five-a-day-evolution/fiveaday/web
  PROD_URL: ${{ secrets.PRODUCTION_URL || 'https://fiveaday-332600671945.europe-southwest1.run.app' }}
  TEST_URL: ${{ secrets.TESTING_URL || 'http://34.26.130.187:8000' }}

jobs:
  # ============================================================
  # JOB 1: Preflight — uses NO cloud credentials
  #
  # Deliberately credential-free so the GCP service account can be pinned to the
  # `production` environment (see scripts/setup_cicd.sh): only a job that has
  # passed the approval gate can obtain a token at all.
  # ============================================================
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    # `types: [completed]` fires on failure and cancellation too — there is no
    # success-only event filter — so gate here. A broken testing deploy must
    # never arm production; the whole run shows as skipped instead.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      should_deploy: ${{ steps.compare.outputs.should_deploy }}
      sha: ${{ github.sha }}
      short_sha: ${{ steps.versions.outputs.short_sha }}
      new_version: ${{ steps.versions.outputs.new_version }}
      live_version: ${{ steps.versions.outputs.live_version }}
      migrations: ${{ steps.migrations.outputs.files }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0   # migration diff and provenance gate need history and tags

      - name: Trigger mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # STRICT events fail LOUDLY when the release is not ready: the nightly
          # workflow_run is the watchdog for a release sitting unshipped, and a
          # workflow_dispatch has a human watching who wants the reason. The
          # day-time events — the release PR merge (push) and QA's sign-off
          # (repository_dispatch) — are SOFT: each fires the moment its own
          # condition became true, so "the other condition is still pending" is
          # the expected state, not a fault. Soft runs end green with
          # should_deploy=false and a summary, never an alarm email; whatever
          # stays pending, the next nightly watchdog run judges strictly.
          case "$EVENT_NAME" in
            push|repository_dispatch) STRICT=false ;;
            *) STRICT=true ;;
          esac
          echo "strict=$STRICT" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT_NAME strict=$STRICT"

      - name: Read versions
        id: versions
        run: |
          NEW_VERSION=$(grep -E '^[[:space:]]*version[[:space:]]*=' pyproject.toml \
            | head -1 | sed -E 's/.*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          [ -n "$NEW_VERSION" ] || { echo "::error::Could not read version from pyproject.toml"; exit 1; }

          BODY=$(curl -fsS --max-time 25 --retry 3 --retry-delay 5 "$PROD_URL/health/" || echo '')
          LIVE_VERSION=''
          ENVIRONMENT=''
          if [ -n "$BODY" ]; then
            LIVE_VERSION=$(printf '%s' "$BODY" | jq -r '.version // empty')
            ENVIRONMENT=$(printf '%s' "$BODY" | jq -r '.environment // empty')
          fi

          # Pointing at something that is not production means the URL is wrong.
          # Never deploy on that basis.
          if [ -n "$ENVIRONMENT" ] && [ "$ENVIRONMENT" != "production" ]; then
            echo "::error::$PROD_URL/health/ reports environment='$ENVIRONMENT', expected 'production'. Refusing to continue."
            exit 1
          fi

          {
            echo "short_sha=$(git rev-parse --short HEAD)"
            echo "new_version=$NEW_VERSION"
            echo "live_version=$LIVE_VERSION"
          } >> "$GITHUB_OUTPUT"

          echo "main pyproject: $NEW_VERSION"
          echo "live on prod:   ${LIVE_VERSION:-unreachable}"

      - name: Anything to deploy?
        id: precheck
        env:
          NEW: ${{ steps.versions.outputs.new_version }}
          LIVE: ${{ steps.versions.outputs.live_version }}
          FORCE: ${{ inputs.force }}
        run: |
          # This workflow runs after EVERY successful nightly testing run, so
          # the common case is "production already serves main" and must exit
          # green and silent BEFORE the QA gate — otherwise every night of an
          # ordinary dev cycle (testing deliberately ahead of main) would end
          # in a red run and an alarm email about a release nobody is shipping.
          if [ "$NEW" = "$LIVE" ] && [ "$FORCE" != "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Nothing to deploy"
              echo ""
              echo "Production already serves \`$NEW\`. Re-run this workflow with **force** if you"
              echo "need to roll the same version again (for example after an env-var repair)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing to deploy: production already serves $NEW."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Gate 1: the version must have arrived via the testing → main release PR'
        id: provenance
        if: steps.precheck.outputs.proceed == 'true'
        env:
          NEW: ${{ steps.versions.outputs.new_version }}
          STRICT: ${{ steps.mode.outputs.strict }}
          FORCE: ${{ inputs.force }}
        run: |
          # auto-merge.yml tags the exact testing commit each release PR ships
          # as testing-vX.Y.Z (the documented manual same-day procedure creates
          # the same tag). That tag being an ancestor of main is proof that this
          # version travelled development → testing → main through the release
          # PR. A version bump that reached main any other way (a stray direct
          # merge — the PR #49 shape) must never arm production: until now that
          # condition was only IMPLICIT in the version compare, this makes it a
          # first-class gate. On the repository_dispatch trigger it is also the
          # normal "PR not merged yet" wait state, hence the soft exit.
          if [ "$FORCE" = "true" ]; then
            echo "::warning::force=true — the release-provenance gate is BYPASSED."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="testing-v$NEW"
          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" > /dev/null \
             && git merge-base --is-ancestor "refs/tags/$TAG^{commit}" HEAD; then
            echo "Gate passed: $TAG is an ancestor of main — v$NEW arrived via the release PR."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=false" >> "$GITHUB_OUTPUT"
          MSG="v$NEW is on main but the release tag $TAG is missing or not an ancestor of main — the testing → main release PR for it has not been merged (or the version arrived outside the release path)."
          if [ "$STRICT" = "true" ]; then
            echo "::error::$MSG Refusing to arm."
            exit 1
          fi
          echo "::notice::$MSG"
          {
            echo "## Not armed — waiting for the release PR"
            echo ""
            echo "$MSG"
            echo ""
            echo "No alarm: tonight's watchdog run re-checks this strictly and emails if it is still unresolved."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'Gate 2: testing must be healthy and signed off for THIS version'
        id: qagate
        if: steps.provenance.outputs.proceed == 'true'
        env:
          NEW: ${{ steps.versions.outputs.new_version }}
          STRICT: ${{ steps.mode.outputs.strict }}
          FORCE: ${{ inputs.force }}
        run: |
          # The QA sign-off gate. Testing's deep health probe must (a) answer and
          # be healthy, (b) serve exactly the version this release ships, and
          # (c) report ready_for_prod=true — which only the "¿Listo para
          # desplegar?" button on /testing/ sets, and which every nightly
          # testing deploy resets to false. A sign-off therefore always refers
          # to the version it was given on, never to an older build. On the
          # push trigger (the PR just merged) an unmet check is the normal
          # "testing has not deployed / QA has not signed off yet" wait state,
          # hence the soft exit.
          if [ "$FORCE" = "true" ]; then
            echo "::warning::force=true — the testing sign-off gate is BYPASSED. This ships without QA validation."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Deliberately no -f: a 503 (degraded deep probe) still carries a JSON
          # body naming what is wrong, which beats "curl: (22)".
          BODY=$(curl -sS --max-time 25 --retry 3 --retry-delay 5 "$TEST_URL/health/?deep=1" || echo '')
          PROBLEMS=()
          if [ -z "$BODY" ] || ! printf '%s' "$BODY" | jq -e . > /dev/null 2>&1; then
            PROBLEMS+=("Testing did not answer /health/?deep=1 — cannot confirm the QA sign-off. Fix the testing VM (or use force for an emergency).")
          else
            printf '%s' "$BODY" | jq .

            STATUS=$(printf '%s' "$BODY" | jq -r '.status // empty')
            ENVIRONMENT=$(printf '%s' "$BODY" | jq -r '.environment // empty')
            TEST_VERSION=$(printf '%s' "$BODY" | jq -r '.version // empty')
            CONNECTED=$(printf '%s' "$BODY" | jq -r '.database.connected // false')
            READY=$(printf '%s' "$BODY" | jq -r '.ready_for_prod // false')

            if [ "$ENVIRONMENT" != "testing" ]; then
              PROBLEMS+=("$TEST_URL reports environment='$ENVIRONMENT', expected 'testing' — the URL points somewhere else.")
            fi
            if [ "$STATUS" != "healthy" ] || [ "$CONNECTED" != "true" ]; then
              PROBLEMS+=("Testing is not healthy (status='$STATUS', database.connected='$CONNECTED').")
            fi
            if [ "$TEST_VERSION" != "$NEW" ]; then
              PROBLEMS+=("Testing serves v$TEST_VERSION but this release is v$NEW — the sign-off (if any) does not apply to this version.")
            fi
            if [ "$READY" != "true" ]; then
              PROBLEMS+=("ready_for_prod is '$READY'. QA has not signed off v$NEW — press '¿Listo para desplegar?' on /testing/ first.")
            fi
          fi

          if [ "${#PROBLEMS[@]}" -eq 0 ]; then
            echo "Gate passed: testing is healthy, serves v$NEW, and QA signed it off."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=false" >> "$GITHUB_OUTPUT"
          if [ "$STRICT" = "true" ]; then
            for p in "${PROBLEMS[@]}"; do echo "::error::$p"; done
            exit 1
          fi
          for p in "${PROBLEMS[@]}"; do echo "::notice::$p"; done
          {
            echo "## Not armed — the release is not ready on testing yet"
            echo ""
            for p in "${PROBLEMS[@]}"; do echo "- $p"; done
            echo ""
            echo "No alarm: tonight's watchdog run re-checks this strictly and emails if it is still unresolved."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for CI to go green on this commit
        if: steps.qagate.outputs.proceed == 'true'
        id: ci
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const sha = context.sha;

            // Jobs of THIS workflow must never be waited on — that deadlocks.
            const SELF = new Set(['Preflight', 'Deploy to production',
              'Notify preflight failure']);
            // Not reasons to block a release: a failed notification email, and
            // the nightly testing workflow's own jobs. Scheduled runs attach
            // their check runs to the tip of main, and this workflow now runs
            // right after Deploy testing, so those results are always present
            // on the commit being polled — but the Phase 1 gate already judges
            // testing's real state through /health/, which is authoritative.
            const ADVISORY = new Set(['Send production notification',
              'Check testing version', 'Deploy to testing VM',
              'Notify check failure']);
            // Check runs posted by these GitHub apps are outside this repo's
            // CI: they cannot be re-run from GitHub, and there is no bypass
            // when they misbehave (`force` skips the QA gate, never this
            // wait). Concretely: the `fiveaday-build` Cloud Build trigger
            // (europe-southwest1) PRE-BUILDS web:<short-sha> + web:latest on
            // every push to main — deliberate, it is what usually lets the
            // build step below skip itself — but it is an optimisation, not a
            // gate: when its image is missing the build step builds inline,
            // so its failure never makes a release undeployable. A transient
            // ghcr.io TLS timeout in it blocked v1.26.5 (run 33636738113,
            // attempt 3). These apps are dropped from the poll wholesale, so
            // a stuck build cannot burn the 45-minute budget either. Checks
            // from apps NOT listed here still wait and still block: the
            // fail-closed default stays.
            const IGNORED_APPS = new Set(['google-cloud-build']);
            // Must be PRESENT and successful. Naming them closes the hole where
            // "some check succeeded" is mistaken for "CI ran": CodeQL and
            // Scorecard also report on main.
            const REQUIRED = ['Lint', 'Type check', 'Tests', 'Docker build'];

            const DEADLINE = Date.now() + 45 * 60 * 1000;
            const SLEEP = 30_000;
            const sleep = ms => new Promise(r => setTimeout(r, ms));

            while (true) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                filter: 'latest',
                per_page: 100,
              });

              const runs = data.check_runs.filter(
                r => !SELF.has(r.name) && !IGNORED_APPS.has(r.app?.slug));

              // Fail CLOSED. Zero check runs is not "healthy", it is "unknown".
              if (runs.length === 0) {
                core.setFailed('No CI check runs found on this commit — refusing to arm a deploy.');
                return;
              }

              const pending = runs.filter(r => r.status !== 'completed');
              if (pending.length > 0) {
                if (Date.now() > DEADLINE) {
                  core.setFailed('Timed out waiting for CI: ' + pending.map(r => r.name).join(', '));
                  return;
                }
                core.info('Waiting on: ' + pending.map(r => r.name).join(', '));
                await sleep(SLEEP);
                continue;
              }

              const present = new Set(runs.map(r => r.name));
              const missing = REQUIRED.filter(n => !present.has(n));
              if (missing.length > 0) {
                // Not a timeout case: every run has completed, so a required
                // check that is absent is never going to appear.
                core.setFailed('Required checks never ran: ' + missing.join(', '));
                return;
              }

              const OK = ['success', 'skipped', 'neutral'];
              const requiredFailed = runs.filter(
                r => REQUIRED.includes(r.name) && !OK.includes(r.conclusion));
              const otherFailed = runs.filter(
                r => !REQUIRED.includes(r.name) && !ADVISORY.has(r.name)
                     && !OK.includes(r.conclusion) && r.conclusion !== 'cancelled');

              if (requiredFailed.length > 0 || otherFailed.length > 0) {
                const all = [...requiredFailed, ...otherFailed]
                  .map(r => `${r.name}: ${r.conclusion}`).join(', ');
                core.setFailed('CI is not green: ' + all);
                return;
              }

              const cancelled = runs.filter(r => r.conclusion === 'cancelled');
              if (cancelled.length > 0) {
                core.warning('Cancelled (non-required) checks ignored: ' +
                  cancelled.map(r => r.name).join(', '));
              }

              core.info('CI is green on ' + sha);
              core.summary.addHeading('CI status', 3);
              core.summary.addTable([
                [{ data: 'Check', header: true }, { data: 'Result', header: true }],
                ...runs.map(r => [r.name, r.conclusion]),
              ]);
              await core.summary.write();
              return;
            }

      - name: List migrations the approver is about to authorise
        if: steps.qagate.outputs.proceed == 'true'
        id: migrations
        # Via env, never interpolated into the body: the value comes from the
        # production /health/ response, i.e. off-box data.
        env:
          LIVE: ${{ steps.versions.outputs.live_version }}
        run: |
          # Based on the version /health/ reports, resolved through the release
          # tag that notify-production.yml creates. Advisory only — the deploy
          # job re-derives this from the image tag Cloud Run actually runs, which
          # is authoritative. Shown here so the approver decides informed.
          FILES=''
          if [ -n "$LIVE" ] && git rev-parse -q --verify "refs/tags/v$LIVE" > /dev/null; then
            FILES=$(git diff --name-only "v$LIVE..HEAD" -- '*/migrations/*.py' | tr '\n' ' ')
            echo "diff v$LIVE..HEAD"
          else
            echo "No release tag v$LIVE — migration list unavailable until the deploy job reads the deployed image tag."
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "migrations: ${FILES:-none}"

      - name: Arm
        id: compare
        # No `if:` — the implicit success() is exactly right: on a "nothing to
        # deploy" night, or when a SOFT gate reported "not yet" (proceed=false,
        # green exit), the later steps are *skipped* or no-ops and this still
        # runs to emit should_deploy=false; but if a STRICT gate FAILED, this
        # is skipped, should_deploy stays empty and the deploy job cannot fire.
        # PROCEED comes from the LAST gate: it is 'true' only when every gate
        # in the chain passed (each gate is skipped unless the previous one
        # emitted proceed=true, and a skipped step's output is empty).
        #
        # All values via env. `FILES='${{ ... }}'` in particular would be an
        # injection sink: it is a list of git paths, and a path may legally
        # contain a single quote, which breaks out of the shell literal.
        env:
          PROCEED: ${{ steps.qagate.outputs.proceed }}
          NEW: ${{ steps.versions.outputs.new_version }}
          LIVE: ${{ steps.versions.outputs.live_version }}
          FILES: ${{ steps.migrations.outputs.files }}
          SHORT_SHA: ${{ steps.versions.outputs.short_sha }}
        run: |
          if [ "$PROCEED" != "true" ]; then
            # Whichever step stopped the chain (precheck's "Nothing to deploy",
            # or a soft gate's "Not armed — waiting") already wrote the summary.
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Production deploy is armed and awaiting approval"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | \`${LIVE:-unknown}\` → \`$NEW\` |"
            echo "| Commit | \`$SHORT_SHA\` |"
            echo "| Image tag | \`$SHORT_SHA\` |"
            echo "| CI | green |"
            echo ""
            if [ -n "$FILES" ]; then
              echo "### ⚠️ Schema migrations in this release"
              echo ""
              for f in $FILES; do echo "- \`$f\`"; done
              echo ""
              echo "Approving this deploy authorises applying them to the live database."
              echo "A verified Cloud SQL backup is taken first and the deploy aborts if it is not \`SUCCESSFUL\`."
            else
              echo "### No schema migrations detected"
              echo ""
              echo "The migrate job is skipped unless the deploy job's authoritative diff disagrees."
            fi
            echo ""
            echo "**To ship:** open the run and click *Review deployments → production → Approve and deploy*."
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # JOB 2: Deploy — BLOCKED on the `production` environment approval
  # ============================================================
  deploy:
    name: Deploy to production
    needs: preflight
    if: needs.preflight.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      # Hard-coded literal: the `secrets` context is not allowed in
      # `environment.url`, and GitHub rejects the ENTIRE workflow file as
      # invalid over it (a zero-job failed run named after the file path) —
      # which is how v1.23.0 landed on main with no working production deploy.
      # The URL is public anyway: it is the fallback literal used in every
      # email step of this file.
      url: https://fiveaday-332600671945.europe-southwest1.run.app

    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    env:
      NEW_SHA: ${{ needs.preflight.outputs.short_sha }}
      NEW_VERSION: ${{ needs.preflight.outputs.new_version }}
      LIVE_VERSION: ${{ needs.preflight.outputs.live_version }}

    steps:
      # Check out the EXACT commit preflight approved, not the branch tip. This
      # is what makes the image tag honest: `gcloud builds submit` uploads the
      # working tree, so building a moved `main` under this SHA's tag would
      # permanently break the SHA→image mapping the migration diff relies on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0

      - name: Assert the tree matches the approved commit
        run: |
          ACTUAL=$(git rev-parse --short HEAD)
          [ "$ACTUAL" = "$NEW_SHA" ] || { echo "::error::HEAD is $ACTUAL, expected $NEW_SHA"; exit 1; }
          [ -z "$(git status --porcelain)" ] || { echo "::error::working tree is dirty"; exit 1; }
          echo "building $NEW_SHA (v$NEW_VERSION)"

      - name: Deployed commit info
        id: commit
        run: |
          # For the success email. The subject is free-form text, so it goes to
          # $GITHUB_OUTPUT through the <<DELIMITER form: a crafted commit
          # message must not be able to forge extra outputs.
          {
            echo "subject<<GH_OUT_EOF"
            git log -1 --pretty=%s
            echo "GH_OUT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Backup health — before anything else
        run: |
          # Every other safety net here assumes a restore is possible. Deploying
          # on top of a broken backup chain is the one state with no way back,
          # and a silently failing backup job looks identical to a working one.
          gcloud sql instances describe "$SQL_INSTANCE" --project="$GCP_PROJECT" \
            --format='yaml(settings.backupConfiguration, settings.deletionProtectionEnabled)'

          CFG=$(gcloud sql instances describe "$SQL_INSTANCE" --project="$GCP_PROJECT" --format=json)
          check() {
            local path="$1" want="$2"
            local got
            got=$(printf '%s' "$CFG" | jq -r "$path")
            if [ "$got" != "$want" ]; then
              echo "::error::$path is '$got', expected '$want'"
              return 1
            fi
            echo "OK: $path = $got"
          }
          FAILED=0
          check '.settings.backupConfiguration.enabled' 'true' || FAILED=1
          check '.settings.backupConfiguration.pointInTimeRecoveryEnabled' 'true' || FAILED=1
          check '.settings.deletionProtectionEnabled' 'true' || FAILED=1

          # Deleting the instance deletes every backup with it, hence the
          # deletionProtection check above.
          LATEST=$(gcloud sql backups list --instance="$SQL_INSTANCE" --project="$GCP_PROJECT" \
            --limit=1 --format='value(status,windowStartTime)')
          echo "newest backup: $LATEST"
          STATUS=$(printf '%s' "$LATEST" | awk '{print $1}')
          WHEN=$(printf '%s' "$LATEST" | awk '{print $2}')
          [ "$STATUS" = "SUCCESSFUL" ] || { echo "::error::newest backup is $STATUS"; FAILED=1; }
          if [ -n "$WHEN" ]; then
            AGE=$(( ($(date +%s) - $(date -d "$WHEN" +%s)) / 3600 ))
            echo "newest backup age: ${AGE}h"
            [ "$AGE" -lt 48 ] || { echo "::error::newest backup is ${AGE}h old (>48h)"; FAILED=1; }
          fi
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Resolve the deployed image and the authoritative migration list
        id: diff
        run: |
          OLD_SHA=$(gcloud run services describe "$SERVICE" --project="$GCP_PROJECT" --region="$GCP_REGION" \
            --format='value(spec.template.spec.containers[0].image)' | sed 's/.*://')
          echo "currently deployed image tag: ${OLD_SHA:-unknown}"

          # Image tags are git short SHAs, so unapplied migrations are a git diff.
          MIGRATIONS=''
          KNOWN=false
          if [ -n "$OLD_SHA" ] && git cat-file -e "${OLD_SHA}^{commit}" 2>/dev/null; then
            MIGRATIONS=$(git diff --name-only "$OLD_SHA..$NEW_SHA" -- '*/migrations/*.py' | tr '\n' ' ')
            KNOWN=true
            echo "diff $OLD_SHA..$NEW_SHA -> ${MIGRATIONS:-none}"
          else
            echo "::warning::Deployed tag '$OLD_SHA' is not a commit in this repo, so the migration diff cannot be computed. Running migrate defensively."
          fi

          # Run migrate when there ARE migrations, or when we cannot prove there
          # are none. `manage.py migrate` on an up-to-date schema is a no-op, so
          # the defensive branch is cheap; skipping a needed migration is not.
          if [ -n "$MIGRATIONS" ] || [ "$KNOWN" != "true" ]; then
            echo "run_migrate=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_migrate=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "old_sha=$OLD_SHA"
            echo "migrations=$MIGRATIONS"
          } >> "$GITHUB_OUTPUT"

      - name: Take a backup and prove it succeeded
        id: backup
        run: |
          # Hard rule: no migration and no rollout without a SUCCESSFUL backup id
          # in hand. An unverified backup is not a rollback plan.
          gcloud sql backups create --instance="$SQL_INSTANCE" --project="$GCP_PROJECT" \
            --description="pre-deploy v$NEW_VERSION ($NEW_SHA) — GitHub Actions run ${{ github.run_id }}"

          BACKUP_ID=$(gcloud sql backups list --instance="$SQL_INSTANCE" --project="$GCP_PROJECT" \
            --limit=1 --format='value(id)')
          STATUS=$(gcloud sql backups describe "$BACKUP_ID" --instance="$SQL_INSTANCE" \
            --project="$GCP_PROJECT" --format='value(status)')
          echo "backup $BACKUP_ID -> $STATUS"
          [ "$STATUS" = "SUCCESSFUL" ] || { echo "::error::backup is $STATUS, not SUCCESSFUL"; exit 1; }
          echo "backup_id=$BACKUP_ID" >> "$GITHUB_OUTPUT"

          # On-demand backups are exempt from the automated retention count, so
          # this will not age out. scripts/backup_retention.sh caps them at 3 —
          # never hand-delete them here.

      - name: Pre-deploy fingerprint
        id: before
        env:
          PROBE: ${{ secrets.HEALTH_PROBE_TOKEN }}
        run: |
          BODY=$(curl -fsS --max-time 30 -H "X-Probe-Token: $PROBE" "$PROD_URL/health/?deep=1" || echo '')
          echo "$BODY" | jq . || echo "$BODY"
          printf '%s' "$BODY" > before.json
          if [ -z "$PROBE" ] || [ "$(printf '%s' "$BODY" | jq -r '.database.counts // empty')" = "" ]; then
            echo "::warning::HEALTH_PROBE_TOKEN is not configured, so row counts are unavailable and the post-deploy report CANNOT prove the data survived."
            echo "counts=false" >> "$GITHUB_OUTPUT"
          else
            echo "counts=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push the image
        run: |
          IMAGE="$IMAGE_BASE:$NEW_SHA"
          # An existing tag means the image was built by an earlier attempt and
          # only the rollout is missing. Rebuilding would be wasteful, not wrong.
          if gcloud artifacts docker tags list "$IMAGE_BASE" --project="$GCP_PROJECT" \
               --format='value(tag)' 2>/dev/null | grep -qx "$NEW_SHA"; then
            echo "$IMAGE already exists — skipping build."
          else
            gcloud builds submit --tag "$IMAGE" --project="$GCP_PROJECT" .
          fi

      - name: Repoint every Cloud Run job at the new image
        id: repoint
        run: |
          IMAGE="$IMAGE_BASE:$NEW_SHA"

          # Enumerated, not hard-coded: a job added later would otherwise keep
          # running last release's code forever, silently, because
          # `gcloud run deploy` only ever touches the SERVICE.
          mapfile -t JOBS < <(gcloud run jobs list --project="$GCP_PROJECT" --region="$GCP_REGION" \
            --format='value(metadata.name)' | sort)
          printf 'found %d jobs:\n' "${#JOBS[@]}"
          printf '  %s\n' "${JOBS[@]}"
          if [ "${#JOBS[@]}" -lt 8 ]; then
            echo "::error::Expected at least 8 Cloud Run jobs, found ${#JOBS[@]}. Refusing to continue with a partial list."
            exit 1
          fi

          for JOB in "${JOBS[@]}"; do
            gcloud run jobs update "$JOB" --image="$IMAGE" \
              --project="$GCP_PROJECT" --region="$GCP_REGION"
          done

          echo "--- verify the pins actually moved ---"
          # Note the DOUBLED template in the path: a job's image lives at
          # spec.template.spec.template.spec. The wrong path prints empty for
          # every job, which reads exactly like a clean result.
          FAILED=0
          for JOB in "${JOBS[@]}"; do
            TAG=$(gcloud run jobs describe "$JOB" --project="$GCP_PROJECT" --region="$GCP_REGION" \
              --format='value(spec.template.spec.template.spec.containers[0].image)' | sed 's/.*://')
            SQL=$(gcloud run jobs describe "$JOB" --project="$GCP_PROJECT" --region="$GCP_REGION" \
              --format='value(spec.template.metadata.annotations."run.googleapis.com/cloudsql-instances")')
            printf '%-32s %-12s %s\n' "$JOB" "$TAG" "$SQL"
            [ "$TAG" = "$NEW_SHA" ] || { echo "::error::$JOB is pinned to '$TAG', expected '$NEW_SHA'"; FAILED=1; }
            # A job attached to another instance would migrate somewhere
            # invisible and still exit 0.
            WANT="$GCP_PROJECT:$GCP_REGION:$SQL_INSTANCE"
            [ "$SQL" = "$WANT" ] || { echo "::error::$JOB is attached to '$SQL', expected '$WANT'"; FAILED=1; }
          done
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Migrate — BEFORE the service rolls
        if: steps.diff.outputs.run_migrate == 'true'
        env:
          MIGRATIONS: ${{ steps.diff.outputs.migrations }}
        run: |
          # Deliberately before the rollout: migrating afterwards leaves new code
          # hitting an old schema for the whole rollout window.
          echo "migrations: ${MIGRATIONS:-none (running defensively)}"
          gcloud run jobs execute fiveaday-migrate \
            --project="$GCP_PROJECT" --region="$GCP_REGION" --wait

      - name: Roll out the service
        id: rollout
        run: |
          # --image and NOTHING else. The service carries ~30 env vars plus 6
          # Secret Manager refs; adding --set-env-vars replaces the entire set
          # and silently drops everything not repeated on the line.
          gcloud run deploy "$SERVICE" --image="$IMAGE_BASE:$NEW_SHA" \
            --project="$GCP_PROJECT" --region="$GCP_REGION"

      - name: Verify the deploy
        id: verify
        env:
          PROBE: ${{ secrets.HEALTH_PROBE_TOKEN }}
          HAVE_COUNTS: ${{ steps.before.outputs.counts }}
        run: |
          # Cloud Run needs a moment plus a possible cold start.
          LIVE=''
          for i in $(seq 1 20); do
            LIVE=$(curl -fsS --max-time 20 "$PROD_URL/health/" 2>/dev/null | jq -r '.version // empty' || true)
            [ "$LIVE" = "$NEW_VERSION" ] && break
            echo "attempt $i: live='${LIVE:-<no reply>}' want='$NEW_VERSION'"
            sleep 15
          done
          if [ "$LIVE" != "$NEW_VERSION" ]; then
            # If the image is definitely current, check for an APP_VERSION env
            # var: it overrides the value baked in from pyproject.toml and makes
            # /health/ lie. Neither environment sets it today.
            gcloud run services describe "$SERVICE" --project="$GCP_PROJECT" --region="$GCP_REGION" \
              --format='value(spec.template.spec.containers[0].env)' | tr ',' '\n' | grep -i APP_VERSION || true
            echo "::error::/health/ reports '${LIVE:-unreachable}', expected '$NEW_VERSION'. The deploy did NOT land."
            exit 1
          fi
          echo "version $LIVE is live"

          echo "--- Cloud SQL attachment ---"
          SQL=$(gcloud run services describe "$SERVICE" --project="$GCP_PROJECT" --region="$GCP_REGION" \
            --format='value(spec.template.metadata.annotations."run.googleapis.com/cloudsql-instances")')
          WANT="$GCP_PROJECT:$GCP_REGION:$SQL_INSTANCE"
          echo "$SQL"
          [ "$SQL" = "$WANT" ] || { echo "::error::service is attached to '$SQL', expected '$WANT'"; exit 1; }

          echo "--- DATABASE_URL must arrive by secret reference ---"
          JSON=$(gcloud run services describe "$SERVICE" --project="$GCP_PROJECT" --region="$GCP_REGION" --format=json)
          printf '%s' "$JSON" | jq -e '
            .spec.template.spec.containers[0].env
            | map(select(.name == "DATABASE_URL"))
            | length == 1 and (.[0].valueFrom.secretKeyRef != null)' > /dev/null \
            || { echo "::error::DATABASE_URL is not a secretKeyRef — a bad --set-env-vars may have flattened it"; exit 1; }

          # POSTGRES_* on the service would turn a loud crash into a silently
          # wrong database: settings.py falls back to localhost/fiveaday_db
          # whenever DATABASE_URL is empty.
          if printf '%s' "$JSON" | jq -e '
              .spec.template.spec.containers[0].env
              | map(select(.name | startswith("POSTGRES_"))) | length > 0' > /dev/null; then
            echo "::error::POSTGRES_* env vars are set on the service — remove them, they mask DATABASE_URL"
            exit 1
          fi
          echo "OK: DATABASE_URL is a secretKeyRef and no POSTGRES_* vars are present"

          echo "--- deep probe ---"
          AFTER=$(curl -fsS --max-time 30 -H "X-Probe-Token: $PROBE" "$PROD_URL/health/?deep=1" || echo '')
          printf '%s' "$AFTER" > after.json
          printf '%s' "$AFTER" | jq . || true
          printf '%s' "$AFTER" | jq -e '.database.connected == true' > /dev/null \
            || { echo "::error::deep probe says the database is not connected"; exit 1; }
          UNAPPLIED=$(printf '%s' "$AFTER" | jq -r '.database.unapplied_migrations // "unknown"')
          echo "unapplied migrations: $UNAPPLIED"
          [ "$UNAPPLIED" = "0" ] || { echo "::error::$UNAPPLIED migrations are still unapplied"; exit 1; }

          if [ "$HAVE_COUNTS" = "true" ]; then
            echo "--- row counts: before → after ---"
            jq -s '{before: .[0].database.counts, after: .[1].database.counts}' before.json after.json
            jq -se '.[0].database.counts as $b | .[1].database.counts as $a
                    | ($a.students >= $b.students) and ($a.payments >= $b.payments)' \
              before.json after.json > /dev/null \
              || echo "::warning::Student or payment counts DROPPED across the deploy. Investigate before announcing the release."
          else
            echo "::warning::Row counts unavailable (no HEALTH_PROBE_TOKEN) — this deploy cannot prove the data survived."
          fi

      - name: Roll back on failure
        id: rollback
        # Fires only when production was actually MUTATED: the repoint step is
        # the first write, so a failure before it (backup checks, build) leaves
        # production untouched and needs no rollback. `steps.repoint.outcome` is
        # 'skipped' in that case; 'success' or 'failure' both mean writes began.
        if: >-
          failure() &&
          (steps.repoint.outcome == 'success' || steps.repoint.outcome == 'failure')
        env:
          OLD_SHA: ${{ steps.diff.outputs.old_sha }}
          ROLLOUT_OUTCOME: ${{ steps.rollout.outcome }}
        run: |
          # Written FIRST and overwritten at the end (last assignment wins), so
          # if this step itself dies mid-way the failure email never claims a
          # clean state it cannot prove.
          {
            echo "state=inconcluso"
            echo "detail=El rollback se inició pero no llegó a informar su resultado — revisa el run y el estado real de los jobs y el servicio."
          } >> "$GITHUB_OUTPUT"

          # CODE ONLY. Never the database: restoring the backup discards every
          # row written since it was taken — that is a human decision, and the
          # backup id is already in the failure email. Rolling code back is
          # schema-safe in the same sense the deploy itself is: migrations run
          # BEFORE the rollout, so the old code already served against the new
          # schema during every deploy's rollout window.
          if [ -z "$OLD_SHA" ]; then
            echo "::error::The previously deployed image tag is unknown — cannot roll back automatically."
            {
              echo "state=manual"
              echo "detail=No se conoce la imagen anterior. Los jobs y/o el servicio pueden estar apuntando a la imagen nueva: hace falta intervención manual (rollback-production.yml con un tag explícito)."
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IMAGE="$IMAGE_BASE:$OLD_SHA"
          FAILED=0

          echo "--- repoint every Cloud Run job back to $OLD_SHA ---"
          mapfile -t JOBS < <(gcloud run jobs list --project="$GCP_PROJECT" --region="$GCP_REGION" \
            --format='value(metadata.name)' | sort)
          for JOB in "${JOBS[@]}"; do
            gcloud run jobs update "$JOB" --image="$IMAGE" \
              --project="$GCP_PROJECT" --region="$GCP_REGION" || FAILED=1
          done
          for JOB in "${JOBS[@]}"; do
            TAG=$(gcloud run jobs describe "$JOB" --project="$GCP_PROJECT" --region="$GCP_REGION" \
              --format='value(spec.template.spec.template.spec.containers[0].image)' | sed 's/.*://')
            [ "$TAG" = "$OLD_SHA" ] || { echo "::error::$JOB is still pinned to '$TAG'"; FAILED=1; }
          done

          if [ "$ROLLOUT_OUTCOME" = "success" ] || [ "$ROLLOUT_OUTCOME" = "failure" ]; then
            echo "--- restore the service by redeploying the previous image ---"
            # Redeploy rather than update-traffic to a named revision: pinning
            # traffic makes every FUTURE `gcloud run deploy` land at 0% traffic
            # and silently fail its verify step. A fresh revision from the old
            # image keeps the normal traffic-follows-latest behaviour. --image
            # alone, as always — anything else clobbers the env set.
            gcloud run deploy "$SERVICE" --image="$IMAGE" \
              --project="$GCP_PROJECT" --region="$GCP_REGION" || FAILED=1

            LIVE=''
            for i in $(seq 1 12); do
              LIVE=$(curl -fsS --max-time 20 "$PROD_URL/health/" 2>/dev/null | jq -r '.version // empty' || true)
              if [ -n "$LIVE" ] && { [ -z "$LIVE_VERSION" ] || [ "$LIVE" = "$LIVE_VERSION" ]; }; then break; fi
              echo "attempt $i: live='${LIVE:-<no reply>}' want='${LIVE_VERSION:-any response}'"
              sleep 15
            done
            if [ -z "$LIVE" ] || { [ -n "$LIVE_VERSION" ] && [ "$LIVE" != "$LIVE_VERSION" ]; }; then
              echo "::error::After the rollback /health/ reports '${LIVE:-unreachable}', expected '${LIVE_VERSION:-a response}'."
              FAILED=1
            else
              echo "rollback verified: /health/ reports v$LIVE"
            fi
            SERVICE_MSG="servicio restaurado y verificado en v${LIVE:-?}"
          else
            SERVICE_MSG="servicio no tocado (el fallo ocurrió antes del rollout)"
          fi

          if [ "$FAILED" -eq 0 ]; then
            {
              echo "state=revertido"
              echo "detail=Los ${#JOBS[@]} jobs vuelven a apuntar a la imagen $OLD_SHA y el $SERVICE_MSG. La base de datos NO se ha tocado: las migraciones de la versión fallida siguen aplicadas."
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "state=fallido"
              echo "detail=El rollback automático NO se completó — revisa el run: algún job o el servicio puede seguir en la imagen nueva ($NEW_SHA en vez de $OLD_SHA)."
            } >> "$GITHUB_OUTPUT"
          fi
          exit "$FAILED"

      - name: Summary
        if: always()
        env:
          ROLLBACK_STATE: ${{ steps.rollback.outputs.state }}
          ROLLBACK_DETAIL: ${{ steps.rollback.outputs.detail }}
          OLD_SHA: ${{ steps.diff.outputs.old_sha }}
          MIGRATIONS: ${{ steps.diff.outputs.migrations }}
          BACKUP_ID: ${{ steps.backup.outputs.backup_id }}
          MIGRATE_RAN: ${{ steps.diff.outputs.run_migrate }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "## Production deploy — ${{ job.status }}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | \`${LIVE_VERSION:-unknown}\` → \`$NEW_VERSION\` |"
            echo "| Image | \`${OLD_SHA:-unknown}\` → \`$NEW_SHA\` |"
            echo "| Backup | \`${BACKUP_ID:-not taken}\` |"
            echo "| Migrate job | $([ "$MIGRATE_RAN" = "true" ] && echo executed || echo 'skipped (no migrations)') |"
            echo "| Auto-rollback | ${ROLLBACK_STATE:-no aplicado} |"
            # On a workflow_run event `github.actor` is inherited from the
            # triggering (testing) run, and on any event it is never whoever
            # clicked Approve — GitHub exposes no approver variable. The
            # approval itself is recorded in the environment's deployment log.
            echo "| Trigger | $EVENT ($ACTOR) |"
            echo ""
            if [ -n "$MIGRATIONS" ]; then
              echo "### Migrations applied"
              echo ""
              for f in $MIGRATIONS; do echo "- \`$f\`"; done
              echo ""
            fi
            echo "### Rollback"
            echo ""
            if [ -n "$ROLLBACK_STATE" ]; then
              echo "Automatic rollback: **$ROLLBACK_STATE** — $ROLLBACK_DETAIL"
              echo ""
            fi
            echo "On demand: run the **Rollback production** workflow (defaults to the previous image, or pass an explicit tag)."
            echo ""
            echo "Data: restore backup \`${BACKUP_ID:-n/a}\` — see DEPLOYMENT.md. Never automated."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify success
        if: success()
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59  # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_HOST_USER }}
          password: ${{ secrets.EMAIL_SECRET }}
          from: "Five a Day CI <${{ secrets.EMAIL_HOST_USER }}>"
          to: hellofiveaday@gmail.com${{ secrets.SUPPORT_EMAIL && format(', {0}', secrets.SUPPORT_EMAIL) || '' }}
          subject: "[Five a Day] v${{ needs.preflight.outputs.new_version }} desplegada en producción"
          html_body: |
            <div style="font-family: sans-serif; color:#1f2937; max-width:640px;">
              <h2 style="color:#6d28d9;">🎉 Nueva versión en producción</h2>
              <p style="font-size:15px; line-height:1.6;">
                ¡Todo ha ido de maravilla! La versión
                <strong>v${{ needs.preflight.outputs.new_version }}</strong>
                (antes <strong>v${{ needs.preflight.outputs.live_version || 'desconocida' }}</strong>)
                se ha desplegado correctamente y ya está funcionando en <strong>producción</strong>.
                Los cambios que validasteis en pruebas están ahora disponibles para todos. 🚀
              </p>
              <p style="font-size:14px; color:#374151; line-height:1.6;">
                <em>${{ steps.commit.outputs.subject }}</em>
              </p>
              <p style="text-align:center; margin:24px 0;">
                <a href="${{ env.PROD_URL }}"
                   style="padding:12px 28px; background:#6d28d9; color:#fff; text-decoration:none; border-radius:8px; font-weight:600; font-size:15px;">
                  Abrir la aplicación →
                </a>
              </p>
              <hr style="border:none; border-top:1px solid #e5e7eb; margin:24px 0;">
              <h3 style="color:#6b7280; font-size:12px; text-transform:uppercase; letter-spacing:0.05em;">Detalles del despliegue</h3>
              <table cellpadding="6" style="border-collapse:collapse; font-family:sans-serif; font-size:13px;">
                <tr><td><strong>Entorno</strong></td><td><a href="${{ env.PROD_URL }}" style="color:#6d28d9;">${{ env.PROD_URL }}</a></td></tr>
                <tr><td><strong>Versión</strong></td><td>v${{ needs.preflight.outputs.live_version || 'desconocida' }} → <strong>v${{ needs.preflight.outputs.new_version }}</strong></td></tr>
                <tr><td><strong>Commit</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.preflight.outputs.sha }}" style="color:#6d28d9;"><code>${{ needs.preflight.outputs.short_sha }}</code></a></td></tr>
                <tr><td><strong>Mensaje</strong></td><td>${{ steps.commit.outputs.subject }}</td></tr>
                <tr><td><strong>Migraciones</strong></td><td>${{ steps.diff.outputs.migrations || 'ninguna' }}</td></tr>
                <tr><td><strong>Copia de seguridad</strong></td><td><code>${{ steps.backup.outputs.backup_id }}</code> (verificada antes de migrar)</td></tr>
                <tr><td><strong>Despliegue</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" style="color:#6d28d9;">registro completo del despliegue</a></td></tr>
              </table>
            </div>

      - name: Notify failure
        if: failure()
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59  # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_HOST_USER }}
          password: ${{ secrets.EMAIL_SECRET }}
          from: "Five a Day CI <${{ secrets.EMAIL_HOST_USER }}>"
          # Failures go to dev/support only — the academy inbox (hellofiveaday)
          # is notified exclusively on successful deploys.
          to: ${{ secrets.SUPPORT_EMAIL || secrets.OWNER_EMAILS }}
          subject: "[Five a Day] 🚨 El despliegue a producción ha fallado"
          html_body: |
            <div style="font-family: sans-serif; color:#1f2937; max-width:640px;">
              <h2 style="color:#b91c1c;">🚨 Despliegue a producción fallido</h2>
              <table cellpadding="6" style="border-collapse:collapse; font-family:sans-serif; font-size:13px;">
                <tr><td><strong>Versión</strong></td><td>v${{ needs.preflight.outputs.new_version }} (detenido)</td></tr>
                <tr><td><strong>Rollback automático</strong></td><td>${{ steps.rollback.outputs.state || 'no aplicado — el fallo ocurrió antes de tocar producción, que sigue en la versión anterior' }}</td></tr>
                <tr><td><strong>Detalle</strong></td><td>${{ steps.rollback.outputs.detail || '—' }}</td></tr>
                <tr><td><strong>Backup previo</strong></td><td><code>${{ steps.backup.outputs.backup_id || 'no llegó a crearse' }}</code> — la BD nunca se revierte sola (DEPLOYMENT.md)</td></tr>
                <tr><td><strong>Rollback manual</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}/actions/workflows/rollback-production.yml">workflow Rollback production</a></td></tr>
                <tr><td><strong>Run fallido</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">logs</a></td></tr>
                <tr><td><strong>Actions</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}/actions">todas las ejecuciones</a></td></tr>
                <tr><td><strong>Producción</strong></td><td><a href="${{ env.PROD_URL }}">${{ env.PROD_URL }}</a> · <a href="${{ env.PROD_URL }}/health/">health</a></td></tr>
                <tr><td><strong>Testing</strong></td><td><a href="${{ env.TEST_URL }}">${{ env.TEST_URL }}</a> · <a href="${{ env.TEST_URL }}/health/">health</a></td></tr>
                <tr><td><strong>Repo</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}">${{ github.repository }}</a> · <a href="${{ github.server_url }}/${{ github.repository }}/tree/main">rama main</a></td></tr>
              </table>
            </div>

  # ============================================================
  # JOB 3: A preflight failure means the release is NOT deployable
  #
  # The deploy job carries its own failure email, but it never starts when
  # preflight fails — QA has not signed off the release, testing serves another
  # version, the release version reached main outside the release PR, CI went
  # red on main, a required check never ran, or the 45-minute wait expired.
  # That is exactly the state somebody needs to know about, and without this it
  # is only a red run in the Actions tab. Preflight only FAILS on the strict
  # triggers (the nightly workflow_run watchdog and workflow_dispatch): the
  # day-time triggers (push, repository_dispatch) end green with a "not armed"
  # summary instead, so this fires once per night while a merged release sits
  # unsigned — that insistence is deliberate: an unshipped release is a state
  # to resolve, not to sit in. A quiet night (production already on main's
  # version) never gets here: the precheck ends the run green before the gates.
  # ============================================================
  notify-preflight-failure:
    name: Notify preflight failure
    needs: preflight
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59  # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_HOST_USER }}
          password: ${{ secrets.EMAIL_SECRET }}
          from: "Five a Day CI <${{ secrets.EMAIL_HOST_USER }}>"
          # Gate alerts go to dev/support only — the academy inbox
          # (hellofiveaday) is notified exclusively on successful deploys.
          to: ${{ secrets.SUPPORT_EMAIL || secrets.OWNER_EMAILS }}
          subject: "[Five a Day] ⚠️ La versión en main NO es desplegable"
          html_body: |
            <div style="font-family: sans-serif; color:#1f2937; max-width:640px;">
              <h2 style="color:#b91c1c;">⚠️ Despliegue a producción no armado</h2>
              <table cellpadding="6" style="border-collapse:collapse; font-family:sans-serif; font-size:13px;">
                <tr><td><strong>Situación</strong></td><td><code>main</code> lleva una versión que producción no sirve, pero el preflight falló — <strong>no hay despliegue esperando aprobación</strong>; producción intacta</td></tr>
                <tr><td><strong>Causa más probable</strong></td><td>falta el visto bueno de QA — botón <em>¿Listo para desplegar?</em> en <a href="${{ env.TEST_URL }}/testing/">/testing/</a> (al pulsarlo, el workflow se re-arma solo)</td></tr>
                <tr><td><strong>Otras causas</strong></td><td>pruebas sirve otra versión o no responde · la versión llegó a <code>main</code> fuera de la PR de release (sin tag <code>testing-vX.Y.Z</code>) · CI en rojo o check obligatorio sin ejecutar · CI no terminó en 45 min</td></tr>
                <tr><td><strong>Run fallido</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">logs</a></td></tr>
                <tr><td><strong>Workflow</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy-production.yml">Deploy production</a> · <a href="${{ github.server_url }}/${{ github.repository }}/actions">Actions</a></td></tr>
                <tr><td><strong>Testing</strong></td><td><a href="${{ env.TEST_URL }}">${{ env.TEST_URL }}</a> · <a href="${{ env.TEST_URL }}/health/?deep=1">health deep</a> · <a href="${{ env.TEST_URL }}/testing/">panel QA</a></td></tr>
                <tr><td><strong>Producción</strong></td><td><a href="${{ env.PROD_URL }}">${{ env.PROD_URL }}</a> · <a href="${{ env.PROD_URL }}/health/">health</a></td></tr>
                <tr><td><strong>Repo</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}">${{ github.repository }}</a> · <a href="${{ github.server_url }}/${{ github.repository }}/tree/main">rama main</a></td></tr>
              </table>
            </div>
