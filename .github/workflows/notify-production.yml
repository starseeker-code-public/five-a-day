name: Notify production

# Fires whenever a new commit lands on main (production). Sends an email to
# hellofiveaday@gmail.com so the team knows a production deploy is ready.

on:
  push:
    branches: [main]

permissions:
  contents: write   # needs write for pushing the release tag

jobs:
  notify:
    name: Send production notification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Need HEAD and HEAD~1 for diff summary
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Gather commit info
        id: info
        run: |
          SHA=${{ github.sha }}
          SHORT_SHA=$(git rev-parse --short "$SHA")
          MESSAGE=$(git log -1 --format="%s" "$SHA")
          AUTHOR=$(git log -1 --format="%an" "$SHA")
          FILES_CHANGED=$(git diff --stat HEAD~1 HEAD | tail -1 || echo "unknown")

          extract_version() {
            git show "$1:pyproject.toml" 2>/dev/null \
              | grep -E '^[[:space:]]*version[[:space:]]*=' | head -1 \
              | sed -E 's/.*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/'
          }
          NEW_VERSION=$(extract_version HEAD)
          OLD_VERSION=$(extract_version HEAD~1)

          {
            echo "short_sha=$SHORT_SHA"
            echo "message=$MESSAGE"
            echo "author=$AUTHOR"
            echo "files_changed=$FILES_CHANGED"
            echo "new_version=$NEW_VERSION"
            echo "old_version=${OLD_VERSION:-$NEW_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Create release tag on main
        id: tag
        run: |
          # Read the authoritative version from pyproject.toml on the just-pushed commit
          VERSION=$(grep -E '^[[:space:]]*version[[:space:]]*=' pyproject.toml \
            | head -1 \
            | sed -E 's/.*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')

          if [ -z "$VERSION" ]; then
            echo "Could not read version from pyproject.toml — skipping release tag."
            echo "created=false"  >> "$GITHUB_OUTPUT"
            echo "tag=(skipped)"  >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="v${VERSION}"

          # Skip if the release tag already exists (e.g. a main push that doesn't bump version,
          # like a direct docs fix or a re-deploy of the same version).
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
            echo "Release tag $TAG already exists — skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG"      >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG (production) — merged from testing"
          git push origin "refs/tags/$TAG"

          echo "Created and pushed release tag $TAG on main HEAD."
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"

      - name: Send email
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_HOST_USER }}
          password: ${{ secrets.EMAIL_SECRET }}
          from: "Five a Day CI <${{ secrets.EMAIL_HOST_USER }}>"
          # hellofiveaday (the academy inbox) + support (set the SUPPORT_EMAIL secret).
          to: hellofiveaday@gmail.com${{ secrets.SUPPORT_EMAIL && format(', {0}', secrets.SUPPORT_EMAIL) || '' }}
          subject: "[Five a Day] v${{ steps.info.outputs.new_version }} lista para producción"
          html_body: |
            <div style="font-family: sans-serif; color:#1f2937; max-width:640px;">
              <h2 style="color:#6d28d9;">✅ Nueva versión lista para producción</h2>
              <p style="font-size:15px; line-height:1.6;">
                La versión <strong>v${{ steps.info.outputs.new_version }}</strong>
                (antes <strong>v${{ steps.info.outputs.old_version }}</strong>) acaba de llegar a la rama
                <strong>producción</strong> (<code>main</code>). Novedad principal:
                <em>${{ steps.info.outputs.message }}</em>. El despliegue a producción está listo cuando queráis.
              </p>
              ${{ secrets.PRODUCTION_URL && format('<p style="text-align:center; margin:24px 0;"><a href="{0}" style="padding:12px 28px; background:#6d28d9; color:#fff; text-decoration:none; border-radius:8px; font-weight:600; font-size:15px;">Abrir producción →</a></p>', secrets.PRODUCTION_URL) || '' }}
              <hr style="border:none; border-top:1px solid #e5e7eb; margin:24px 0;">
              <h3 style="color:#6b7280; font-size:12px; text-transform:uppercase; letter-spacing:0.05em;">Detalles técnicos</h3>
              <table cellpadding="6" style="border-collapse: collapse; font-family: sans-serif; font-size:13px;">
                <tr><td><strong>Entorno</strong></td><td>Producción (main)</td></tr>
                <tr><td><strong>Versión</strong></td><td><code>${{ steps.info.outputs.old_version }}</code> → <code>${{ steps.info.outputs.new_version }}</code></td></tr>
                <tr><td><strong>Etiqueta de release</strong></td><td><code>${{ steps.tag.outputs.tag }}</code> (${{ steps.tag.outputs.created == 'true' && 'recién creada' || 'ya existía — sin cambio de versión' }})</td></tr>
                <tr><td><strong>Commit</strong></td><td><code>${{ steps.info.outputs.message }}</code></td></tr>
                <tr><td><strong>Autor</strong></td><td>${{ steps.info.outputs.author }}</td></tr>
                <tr><td><strong>SHA</strong></td><td><code>${{ steps.info.outputs.short_sha }}</code></td></tr>
                <tr><td><strong>Archivos cambiados</strong></td><td>${{ steps.info.outputs.files_changed }}</td></tr>
                <tr><td><strong>Repositorio</strong></td><td>${{ github.repository }}</td></tr>
              </table>
              <p style="margin-top:16px;">
                <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}" style="padding:8px 16px; background:#6b46c1; color:#fff; text-decoration:none; border-radius:4px; font-size:13px;">Ver commit →</a>
              </p>
              <hr style="border:none; border-top:1px solid #e5e7eb; margin:16px 0;">
              <h3 style="font-size:13px; color:#374151;">Pasos de despliegue</h3>
              <ol style="font-size:13px; color:#4b5563;">
                <li>Verificar que CI está en verde en este commit.</li>
                <li>Desplegar en Cloud Run:
                  <pre style="background:#f4f4f4; padding:8px; font-size:12px;">gcloud builds submit --tag $IMAGE .
            gcloud run deploy fiveaday --image=$IMAGE --region=europe-southwest1</pre>
                </li>
                <li>Ejecutar migraciones si cambió el esquema:
                  <pre style="background:#f4f4f4; padding:8px; font-size:12px;">gcloud run jobs execute fiveaday-migrate --region=europe-southwest1 --wait</pre>
                </li>
              </ol>
              <p style="color:#9ca3af; font-size:12px;">Enviado automáticamente por el workflow notify-production en cada push a <code>main</code>.</p>
            </div>
