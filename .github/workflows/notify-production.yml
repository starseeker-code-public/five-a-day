name: Notify production

# Fires whenever a new commit lands on main (production). Sends an email to
# hellofiveaday@gmail.com so the team knows a production deploy is ready.

on:
  push:
    branches: [main]

permissions:
  contents: write   # needs write for pushing the release tag

# This workflow PUSHES the release tag vX.Y.Z. Two pushes to main in quick
# succession (a release merge followed by a docs fix) would otherwise run
# concurrently and race on `git ls-remote` → `git tag` → `git push`, where the
# loser fails on a tag that appeared between its check and its push.
# Deliberately NOT the shared `deploy-production` group: that group can sit
# occupied for hours waiting on the environment approval, and queueing behind
# it would delay creating the release tag — which the production preflight's
# migration list reads.
concurrency:
  group: notify-production
  cancel-in-progress: false

env:
  # Non-secret last resort so a release heads-up can never be addressed to
  # nobody. See the same block in auto-merge.yml.
  ALERT_TO: ${{ secrets.SUPPORT_EMAIL || secrets.OWNER_EMAILS || secrets.EMAIL_HOST_USER }}

jobs:
  notify:
    name: Send production notification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2  # Need HEAD and HEAD~1 for diff summary
          token: ${{ secrets.GH_PAT || github.token }}
          # Keep the repo-write token out of .git/config for the rest of the
          # job (a third-party mail action runs later in it). The tag step
          # supplies it for the length of one push.
          persist-credentials: false

      - name: Gather commit info
        id: info
        env:
          # Via env, never interpolated into the body. `github.sha` is a hex
          # string so this one was harmless, but the rule has no exceptions —
          # the engine substitutes before bash parses, and the next value
          # somebody adds here may not be hex.
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA=$(git rev-parse --short "$SHA")
          MESSAGE=$(git log -1 --format="%s" "$SHA")
          AUTHOR=$(git log -1 --format="%an" "$SHA")
          FILES_CHANGED=$(git diff --stat HEAD~1 HEAD | tail -1 || echo "unknown")

          extract_version() {
            git show "$1:pyproject.toml" 2>/dev/null \
              | grep -E '^[[:space:]]*version[[:space:]]*=' | head -1 \
              | sed -E 's/.*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/'
          }
          NEW_VERSION=$(extract_version HEAD)
          OLD_VERSION=$(extract_version HEAD~1)

          # HTML-escape the subject: it is author-controlled and this output is
          # used ONLY inside the email body below, so escaping in place is safe
          # (unlike auto-merge.yml, where the same text is also a PR title).
          html_escape() {
            printf '%s' "$1"               | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'                     -e 's/"/\&quot;/g' -e "s/'/\&#39;/g"
          }
          MESSAGE=$(html_escape "$MESSAGE")
          AUTHOR=$(html_escape "$AUTHOR")

          # Free-form values (subject, author, diffstat) go through the
          # <<DELIMITER form with a run-unique marker and printf '%s\n' — a
          # plain `k=v` line lets a value carrying a newline forge extra
          # outputs, and `echo` would additionally eat a leading -n/-e.
          DELIM="FAD_EOF_$(openssl rand -hex 12 2>/dev/null || date +%s%N)"
          {
            printf 'short_sha=%s\n' "$SHORT_SHA"
            printf 'new_version=%s\n' "$NEW_VERSION"
            printf 'old_version=%s\n' "${OLD_VERSION:-$NEW_VERSION}"
            printf 'message<<%s\n' "$DELIM"; printf '%s\n' "$MESSAGE";       printf '%s\n' "$DELIM"
            printf 'author<<%s\n'  "$DELIM"; printf '%s\n' "$AUTHOR";        printf '%s\n' "$DELIM"
            printf 'files_changed<<%s\n' "$DELIM"; printf '%s\n' "$FILES_CHANGED"; printf '%s\n' "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Create release tag on main
        id: tag
        env:
          # Push credential scoped to this step (persist-credentials: false).
          GIT_PUSH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          # Read the authoritative version from pyproject.toml on the just-pushed commit
          VERSION=$(grep -E '^[[:space:]]*version[[:space:]]*=' pyproject.toml \
            | head -1 \
            | sed -E 's/.*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')

          if [ -z "$VERSION" ]; then
            echo "Could not read version from pyproject.toml — skipping release tag."
            echo "created=false"  >> "$GITHUB_OUTPUT"
            echo "tag=(skipped)"  >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="v${VERSION}"

          # Same mechanism actions/checkout uses, scoped to these commands
          # instead of persisted in .git/config for the whole job.
          AUTH_B64=$(printf 'x-access-token:%s' "$GIT_PUSH_TOKEN" | base64 -w0)
          gitauth() { git -c http.extraheader="AUTHORIZATION: basic $AUTH_B64" "$@"; }

          # Skip if the release tag already exists (e.g. a main push that doesn't bump version,
          # like a direct docs fix or a re-deploy of the same version).
          if gitauth ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
            echo "Release tag $TAG already exists — skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG"      >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG (production) — merged from testing"
          gitauth push origin "refs/tags/$TAG"

          echo "Created and pushed release tag $TAG on main HEAD."
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"

      - name: Send email
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59  # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_HOST_USER }}
          password: ${{ secrets.EMAIL_SECRET }}
          from: "Five a Day CI <${{ secrets.EMAIL_HOST_USER }}>"
          # Dev/support only — the academy inbox (hellofiveaday) is notified
          # exclusively on successful deploys, and this is a release heads-up.
          to: ${{ env.ALERT_TO }}
          subject: "[Five a Day] v${{ steps.info.outputs.new_version }} lista para producción"
          html_body: |
            <div style="font-family: sans-serif; color:#1f2937; max-width:640px;">
              <h2 style="color:#6d28d9;">✅ Versión en main — a la espera del despliegue CI/CD</h2>
              <table cellpadding="6" style="border-collapse: collapse; font-family: sans-serif; font-size:13px;">
                <tr><td><strong>Situación</strong></td><td>v${{ steps.info.outputs.new_version }} fusionada en <code>main</code>; el workflow <em>Deploy production</em> se arma solo (visto bueno de QA + re-disparo nocturno) y espera aprobación en el entorno <code>production</code> — sin pasos manuales</td></tr>
                <tr><td><strong>Versión</strong></td><td><code>${{ steps.info.outputs.old_version }}</code> → <code>${{ steps.info.outputs.new_version }}</code></td></tr>
                <tr><td><strong>Etiqueta de release</strong></td><td><code>${{ steps.tag.outputs.tag }}</code> (${{ steps.tag.outputs.created == 'true' && 'recién creada' || 'ya existía — sin cambio de versión' }})</td></tr>
                <tr><td><strong>Commit</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"><code>${{ steps.info.outputs.short_sha }}</code></a> — ${{ steps.info.outputs.message }}</td></tr>
                <tr><td><strong>Archivos cambiados</strong></td><td>${{ steps.info.outputs.files_changed }}</td></tr>
                <tr><td><strong>Deploy production</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy-production.yml">workflow (aprobar aquí cuando se arme)</a></td></tr>
                <tr><td><strong>Actions</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}/actions">todas las ejecuciones</a></td></tr>
                <tr><td><strong>Testing</strong></td><td><a href="${{ secrets.TESTING_URL || 'http://34.26.130.187:8000' }}">abrir</a> · <a href="${{ secrets.TESTING_URL || 'http://34.26.130.187:8000' }}/health/?deep=1">health deep</a> · <a href="${{ secrets.TESTING_URL || 'http://34.26.130.187:8000' }}/testing/">panel QA</a></td></tr>
                <tr><td><strong>Producción</strong></td><td><a href="${{ secrets.PRODUCTION_URL || 'https://fiveaday-332600671945.europe-southwest1.run.app' }}">abrir</a> · <a href="${{ secrets.PRODUCTION_URL || 'https://fiveaday-332600671945.europe-southwest1.run.app' }}/health/">health</a></td></tr>
                <tr><td><strong>Repo</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}">${{ github.repository }}</a> · <a href="${{ github.server_url }}/${{ github.repository }}/tree/main">rama main</a></td></tr>
              </table>
            </div>
