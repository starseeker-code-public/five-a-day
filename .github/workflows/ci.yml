name: CI

on:
  push:
    branches: [development, testing, main]
  pull_request:
    branches: [development, testing, main]

# Cancel in-progress runs on the same branch when new commits arrive
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for EVERY job in this file. This was the one workflow with no
# top-level `permissions:` block, so its jobs ran with whatever the repository
# default happens to be (historically read/write for everything) — while
# executing arbitrary code from any pushed branch and from PR head refs:
# `uv sync`, pytest, ruff plugins, a Docker build. One malicious or merely
# compromised dependency in that set had a token that could push to a branch or
# publish a package. Jobs that need more declare it themselves below; note a
# job-level block REPLACES this one wholesale, so each override must repeat
# `contents: read` (checkout needs it).
permissions:
  contents: read

jobs:
  # ============================================================
  # JOB 1: Lint — Ruff (fast, no DB needed)
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-install-project

      - name: Ruff — check
        run: uv run --no-project ruff check project/

      - name: Ruff — format
        run: uv run --no-project ruff format --check project/

      - name: Bandit — security linter
        run: PYTHONUTF8=1 uv run bandit -r project/ -c pyproject.toml

      - name: pip-audit — dependency CVE scan
        run: uv run pip-audit

      - name: Hadolint — Dockerfile lint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: Dockerfile

  # ============================================================
  # JOB 2: Type check — mypy (no DB needed)
  # ============================================================
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-install-project

      - name: mypy
        env:
          # django-stubs plugin imports project.settings at load time. Our settings.py
          # raises ValueError when DEBUG=False AND SECRET_KEY is the dev default, so we
          # set DJANGO_DEBUG=True to bypass that check during static analysis.
          DJANGO_SETTINGS_MODULE: project.settings
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: mypy-static-analysis-dummy-key
          PYTHONPATH: project
        run: uv run mypy project/

  # ============================================================
  # JOB 3: Tests — pytest against PostgreSQL
  # ============================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fiveaday_test
          POSTGRES_USER: fiveaday_user
          POSTGRES_PASSWORD: fiveaday_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-install-project

      - name: Run tests (unit + integration)
        working-directory: project
        env:
          DJANGO_SETTINGS_MODULE: project.settings_test
          POSTGRES_DB: fiveaday_test
          POSTGRES_USER: fiveaday_user
          POSTGRES_PASSWORD: fiveaday_test_pw
          TEST_DB_HOST: localhost
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          LOGIN_USERNAME: ci_admin
          LOGIN_PASSWORD: ci_test_password
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          # Tests live in project/tests/unit/ and project/tests/integration/.
          # Pytest auto-discovers both subdirectories when we point it at tests/.
          #
          # --cov-config is REQUIRED. This step runs with `working-directory: project`,
          # but [tool.coverage.run] — including the omit list for migrations,
          # management commands and admin.py — lives in the repo-root pyproject.toml.
          # Coverage only looks for config in the CURRENT directory, so without this
          # flag the omit list is silently ignored: ~993 extra statements get measured
          # and the reported figure drops from 95.49% to 86.44%, firing the <90%
          # warning on every run.
          uv run python -m pytest tests/ -v --tb=short -n auto \
            --cov=core --cov=students --cov=billing --cov=comms \
            --cov-config=../pyproject.toml \
            --cov-report=xml --cov-report=term-missing

      # Coverage thresholds:
      #   < 75% → fail CI (hard floor; same threshold the pre-commit hook enforces)
      #   < 90% → warning annotation (visible in the PR checks UI, does not fail)
      #   ≥ 90% → silent pass (current coverage is 95.49%)
      - name: Check coverage threshold
        if: always()
        working-directory: project
        run: |
          if [ ! -f coverage.xml ]; then
            echo "::error::coverage.xml not found — test step likely failed before coverage could be written"
            exit 1
          fi
          COV=$(python -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().attrib['line-rate']) * 100, 2))")
          echo "Coverage: ${COV}%"
          FLOOR=75
          TARGET=90
          # awk exits 0 (shell-if fires) when condition is FALSE:
          #   exit (c >= f) ? 1 : 0  →  exits 0 when c < f  →  error path runs
          if awk -v c="$COV" -v f="$FLOOR" 'BEGIN { exit (c >= f) ? 1 : 0 }'; then
            echo "::error::Coverage ${COV}% is below the ${FLOOR}% hard floor — CI fails"
            exit 1
          fi
          if awk -v c="$COV" -v t="$TARGET" 'BEGIN { exit (c >= t) ? 1 : 0 }'; then
            echo "::warning::Coverage ${COV}% is below the ${TARGET}% target (warning only; CI still passes down to ${FLOOR}%)"
          else
            echo "Coverage ${COV}% meets the ${TARGET}% target."
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: project/coverage.xml
          retention-days: 7

  # ============================================================
  # JOB 4: Docker build — validates Dockerfile builds cleanly
  # ============================================================
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: false
          tags: five-a-day:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 5: Trivy — filesystem CVE scan → GitHub Security tab
  # ============================================================
  trivy:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Trivy — scan Python dependencies and filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: trivy-results.sarif

  # ============================================================
  # JOB 6: Publish to GHCR + Trivy image scan
  # Runs only on push to main or testing (not on PRs).
  # Depends on test + docker-build passing first.
  # ============================================================
  docker-publish:
    name: Publish image & scan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [test, docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — scan Docker image for OS-level CVEs (SARIF, reporting)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: sarif
          output: trivy-image-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload image scan to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: trivy-image-results.sarif

      # ----------------------------------------------------------
      # THE GATE. Everything above only REPORTS: a SARIF upload
      # decorates the Security tab and cannot fail a check, so a
      # CRITICAL in the runtime layer never once stopped a release.
      # This job runs on push to main and testing, and its check run
      # ("Publish image & scan") is inside the set deploy-production's
      # preflight polls — so a red gate here is what actually prevents
      # the image from being armed for production.
      #
      # Scope of the gate, deliberately narrow:
      #   · HIGH + CRITICAL only (MEDIUM is noise on a Debian slim base)
      #   · ignore-unfixed: an advisory with no fixed version available
      #     cannot be acted on by bumping anything, so blocking on it
      #     would only teach people to bypass the gate
      #   · vuln class only — misconfig/secret scanning is not enabled
      #     here (pip-audit + gitleaks-style checks live elsewhere)
      # ESCAPE HATCH: add the CVE id to .github/trivyignore with a
      # one-line reason and an owner — an ignore is then visible in the
      # diff and in code review, never a silent workflow edit. It is
      # applied to the GATE only, on purpose: the SARIF upload above
      # keeps reporting the finding to the Security tab, so an ignored
      # CVE stays visible rather than disappearing from the record.
      # ----------------------------------------------------------
      - name: Trivy — gate (JSON report for the exit check)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: json
          output: trivy-image-gate.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .github/trivyignore
          # exit-code stays 0 here: the step must produce the report so the
          # check below can tell "clean" apart from "the scanner never ran",
          # which is the whole point of the next step.
          exit-code: '0'

      - name: Fail the build on HIGH/CRITICAL in the image
        run: |
          # A scanner outage must NOT pass silently. The two failure modes are
          # deliberately distinguished: a missing/unparseable report is an
          # infrastructure failure (red, "re-run"), findings are a security
          # failure (red, "fix or ignore explicitly"). An empty file, a
          # zero-length JSON or an absent Results key are all treated as "the
          # scan did not happen" — never as "nothing found".
          if [ ! -s trivy-image-gate.json ]; then
            echo "::error::Trivy produced no report (missing or empty trivy-image-gate.json). Treating as a FAILED scan, not a clean one — re-run the job."
            exit 1
          fi
          if ! jq -e 'has("Results") or has("SchemaVersion")' trivy-image-gate.json > /dev/null 2>&1; then
            echo "::error::trivy-image-gate.json is not a Trivy report (scanner error, DB download failure, or rate limit). Treating as a FAILED scan."
            head -c 600 trivy-image-gate.json
            exit 1
          fi

          COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' trivy-image-gate.json)
          echo "HIGH/CRITICAL (fixable) vulnerabilities: $COUNT"

          {
            echo "### Trivy image gate"
            echo ""
            echo "Fixable HIGH/CRITICAL findings: **$COUNT**"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$COUNT" -gt 0 ]; then
            jq -r '.Results[]? | . as $r | (.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")
                    | "- \(.Severity)  \(.VulnerabilityID)  \(.PkgName) \(.InstalledVersion) → \(.FixedVersion // "no fix")  [\($r.Target)]")' \
              trivy-image-gate.json | tee -a "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "::error::$COUNT fixable HIGH/CRITICAL vulnerabilities in the runtime image. Bump the dependency or the base image digest (Dependabot watches both), or — only with a written reason — add the id to .github/trivyignore."
            exit 1
          fi
          echo "No fixable HIGH/CRITICAL findings." >> "$GITHUB_STEP_SUMMARY"
