version: 2

updates:
  # Python dependencies (pip / uv)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    target-branch: development
    labels:
      - dependencies
      - python
    groups:
      # Group all non-breaking minor/patch updates into one PR
      python-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Django major versions require manual upgrade planning
      - dependency-name: django
        update-types: [version-update:semver-major]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    target-branch: development
    labels:
      - dependencies
      - github-actions

  # Keeps the digest-pinned images in the Dockerfile current (python:3.12-slim
  # base and the ghcr.io/astral-sh/uv COPY --from). Without this nothing
  # watches them at all — pip and github-actions were covered, the container
  # images were not. target-branch matters: without it these PRs land on the
  # DEFAULT branch (main), planting non-ancestor commits outside the
  # development → testing → main path.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    target-branch: development
    labels:
      - dependencies
      - docker
