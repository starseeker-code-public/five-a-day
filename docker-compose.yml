# ============================================================================
# DOCKER COMPOSE - Five a Day Application
# ============================================================================
# Este archivo orquesta todos los servicios necesarios para la aplicación.
# Servicios actuales: PostgreSQL + Django
# Servicios futuros (comentados): Redis, Celery, Frontend, Nginx
#
# ── THREE-FILE LAYOUT (read this before adding a volume or a command) ───────
#   docker-compose.yml           this file — the IMAGE as it ships. No source
#                                bind mounts, no command overrides: the app
#                                containers run the code that was COPYied into
#                                the image, exactly like Cloud Run does.
#   docker-compose.override.yml  DEVELOPMENT only. Compose loads it
#                                AUTOMATICALLY on a bare `docker compose …`,
#                                and NOT when files are named with `-f`. It is
#                                what re-adds the live source mount and swaps
#                                gunicorn for runserver.
#   docker-compose.testing.yml   the QA VM overlay, named explicitly with
#                                `-f docker-compose.yml -f docker-compose.testing.yml`
#                                — so it does NOT pick the override up, and QA
#                                exercises the built image.
#
# The split exists because a Compose override cannot REMOVE an inherited
# volume (lists are merged, `volumes: []` is a no-op), so the only way for the
# QA stack not to run the VM's working tree was for the base file never to
# mount it. Consequence worth knowing: `docker compose -f docker-compose.yml up`
# (one file, no override) now runs the image's own gunicorn CMD — and the DB
# still attaches to the dev `postgres_data` volume, which on the QA VM is the
# documented data-loss incident. Always pass BOTH -f files there.


# ============================================================================
# SERVICIOS
# ============================================================================
services:
  
  # ==========================================================================
  # PostgreSQL - Base de datos principal
  # ==========================================================================
  db:
    image: postgres:16-alpine
    container_name: fiveaday_postgres
    restart: unless-stopped
    
    # Variables de entorno para PostgreSQL
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fiveaday_db}
      POSTGRES_USER: ${POSTGRES_USER:-fiveaday_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    
    # Persistencia de datos
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      - ./backups:/backups  # Para backups de base de datos
    
    # Puerto expuesto (solo para desarrollo local)
    ports:
      - "127.0.0.1:5432:5432"
    
    # Healthcheck: tests actual TCP auth, not just connectivity.
    # This ensures depends_on: service_healthy only passes when the web
    # container can actually authenticate (catches stale-volume password mismatches).
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD:-change_this_password} psql -h 127.0.0.1 -U ${POSTGRES_USER:-fiveaday_user} -d ${POSTGRES_DB:-fiveaday_db} -c '\\q'"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    # Red interna
    networks:
      - fiveaday_network

  # ==========================================================================
  # Django Application - Backend
  # ==========================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiveaday_django
    restart: unless-stopped
    env_file:
      - .env

    # NO `command:` here on purpose — the container runs the Dockerfile CMD
    # (gunicorn --chdir project …). docker-compose.override.yml swaps in
    # runserver for local development; docker-compose.testing.yml pins the
    # QA-tuned gunicorn flags.
    #
    # Puerto expuesto al host
    ports:
      - "8000:8000"

    # Environment overrides for Docker networking
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      POSTGRES_HOST: db
      # Academy runs on Madrid time; the image is UTC otherwise. See Dockerfile.
      TZ: Europe/Madrid

    # NO source bind mount here on purpose — see the three-file note at the top
    # of this file. The live-reload mount lives in docker-compose.override.yml
    # so that the QA stack (which names its files with -f) runs the image.

    # Wait for PostgreSQL + Redis before starting
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Red interna
    networks:
      - fiveaday_network

  # ==========================================================================
  # REDIS - Message Broker for Celery
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: fiveaday_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fiveaday_network

  # ==========================================================================
  # CELERY WORKER - Async task processing
  # In production (GCP) this is replaced by Cloud Tasks — no worker process
  # runs on Cloud Run. Tasks execute synchronously via CELERY_TASK_ALWAYS_EAGER.
  # ==========================================================================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiveaday_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      POSTGRES_HOST: db
      # Academy runs on Madrid time; the image is UTC otherwise. See Dockerfile.
      TZ: Europe/Madrid
    # Source mount: docker-compose.override.yml (development only).
    working_dir: /app/project
    command: celery -A project.celery worker -l info -Q celery,emails --concurrency=2
    # Overrides the Dockerfile HEALTHCHECK, which probes /health/ over HTTP — no
    # web server runs here, so the inherited check can never pass and the
    # container sits permanently unhealthy. Ping this node by name: replying to a
    # broadcast is not proof THIS worker is the one alive. $$ escapes the $ so
    # HOSTNAME is read in the container, not substituted by Compose from the host.
    healthcheck:
      test: ["CMD-SHELL", "celery -A project.celery inspect ping -d celery@$$HOSTNAME --timeout 10 >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      start_period: 40s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fiveaday_network

  # ==========================================================================
  # CELERY BEAT - Scheduled tasks (cron)
  # In production (GCP) this is replaced by Cloud Scheduler — cron jobs trigger
  # Cloud Run Jobs that execute Django management commands directly.
  # ==========================================================================
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiveaday_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      POSTGRES_HOST: db
      # Academy runs on Madrid time; the image is UTC otherwise. See Dockerfile.
      TZ: Europe/Madrid
    # Source mount: docker-compose.override.yml (development only).
    working_dir: /app/project
    command: celery -A project.celery beat -l info --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    # Overrides the Dockerfile HEALTHCHECK (see celery_worker). Beat has no
    # inspect interface, so liveness is the pidfile it was told to write.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fiveaday_network

  # ==========================================================================
  # FRONTEND - React/Vue/Next.js (FUTURO)
  # ==========================================================================
  # Descomenta cuando desarrolles el frontend separado
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: fiveaday_frontend
  #   restart: unless-stopped
  #   
  #   environment:
  #     REACT_APP_API_URL: http://web:8000
  #     NODE_ENV: ${NODE_ENV:-development}
  #   
  #   volumes:
  #     - ./frontend/src:/app/src
  #     - ./frontend/public:/app/public
  #   
  #   ports:
  #     - "3000:3000"
  #   
  #   depends_on:
  #     - web
  #   
  #   networks:
  #     - fiveaday_network

# ============================================================================
# VOLÚMENES PERSISTENTES
# ============================================================================
# static_volume and media_volume used to be declared here and mounted nowhere —
# Compose created neither (it only materialises volumes a service references),
# so they were two lines of fiction. Neither is needed: `staticfiles/` is
# regenerated by `collectstatic --clear` on every boot (entrypoint.sh) and
# served by WhiteNoise from inside the container, and MEDIA_ROOT has no writer
# at all — no model in the tree has a FileField or an ImageField, and the QA
# backlog screenshot is attached to the notification email in memory and
# deliberately never stored. If a real upload ever lands, add a named volume
# AND mount it on `web` in the same change.
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ============================================================================
# REDES
# ============================================================================
networks:
  fiveaday_network:
    driver: bridge
