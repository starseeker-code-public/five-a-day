{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Restablecer contraseña · Five a Day{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Montserrat+Alternates:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat Alternates', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #ede9fe 0%, #f5f3ff 40%, #fdf4ff 70%, #fce7f3 100%);
            display: flex; align-items: center; justify-content: center; padding: 2rem;
        }
        .wrapper { width: 100%; max-width: 440px; }
        .title-block { text-align: center; margin-bottom: 1.6rem; }
        .title-block h1 {
            font-family: 'Parisienne', cursive;
            font-size: 3rem;
            color: #5b21b6;
            font-weight: 400;
        }
        .title-block p {
            font-size: 0.82rem; font-weight: 500; color: #a78bfa;
            letter-spacing: 0.1em; text-transform: uppercase; margin-top: 0.5rem;
        }
        .card {
            background: rgba(255,255,255,0.93);
            backdrop-filter: blur(12px);
            border-radius: 1.75rem;
            padding: 2.25rem 2rem 2rem;
            box-shadow: 0 8px 40px rgba(124,58,237,0.13), 0 1.5px 6px rgba(124,58,237,0.07);
            border: 1.5px solid rgba(196,181,253,0.5);
        }
        .card h2 {
            font-size: 1.4rem;
            color: #5b21b6;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .card p.lead {
            font-size: 0.88rem; color: #6d28d9; margin-bottom: 1.25rem; text-align: center;
        }
        .flash {
            padding: 0.75rem 1rem; border-radius: 0.75rem; font-size: 0.84rem;
            margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;
        }
        .flash.error   { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
        .flash.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
        .field { margin-bottom: 1.1rem; }
        .field label {
            display: block; font-size: 0.8rem; font-weight: 600; color: #6d28d9;
            margin-bottom: 0.4rem; letter-spacing: 0.03em;
        }
        .field input {
            width: 100%; padding: 0.7rem 0.9rem; border: 1.5px solid #ddd6fe;
            border-radius: 0.65rem; font-family: inherit; font-size: 0.9rem;
            color: #1e1b4b; background: #faf5ff; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field input:focus {
            border-color: #6ee7b7; box-shadow: 0 0 0 3px rgba(110,231,183,0.25); background: #fff;
        }
        .field ul.errorlist {
            list-style: none; color: #991b1b; font-size: 0.78rem; margin-top: 0.3rem;
        }
        .btn {
            width: 100%; padding: 0.85rem; border-radius: 0.75rem; border: none;
            font-family: inherit; font-size: 0.93rem; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 0.6rem;
            background: linear-gradient(135deg, #7c3aed, #9333ea);
            color: #fff; box-shadow: 0 4px 18px rgba(124,58,237,0.35);
            transition: all 0.2s; text-decoration: none; margin-top: 0.5rem;
        }
        .btn:hover {
            background: linear-gradient(135deg, #6d28d9, #7c3aed);
            transform: translateY(-1px);
        }
        .footer-link {
            text-align: center; margin-top: 1.25rem; font-size: 0.82rem;
        }
        .footer-link a {
            color: #7c3aed; text-decoration: none; border-bottom: 1px dotted #a78bfa;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="title-block">
            <h1>Five a Day</h1>
            <p>Donde el inglés es tuyo</p>
        </div>
        <div class="card">
            {% if messages %}
                {% for message in messages %}
                <div class="flash {% if message.tags == 'error' %}error{% else %}success{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}
            {% block card_body %}{% endblock %}
        </div>
    </div>
</body>
</html>
