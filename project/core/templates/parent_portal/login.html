{% extends 'parent_portal/base_portal.html' %}
{% block title %}Acceso · Portal Five a Day{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow p-8 mt-8">
    <h1 class="text-2xl font-bold text-neutral-800 mb-2">Acceso al portal</h1>
    <p class="text-neutral-600 mb-6">Escribe tu email y te enviaremos un enlace de acceso por correo.</p>
    <form method="post">
        {% csrf_token %}
        <label class="block text-sm text-neutral-600 mb-1">Email</label>
        <input type="email" name="email" required autofocus
               class="w-full px-3 py-2 border border-neutral-300 rounded-md text-sm mb-4"
               placeholder="tu@email.com">
        <button type="submit" class="w-full brand-bg text-white py-2 rounded-md font-medium hover:opacity-90">Enviar enlace</button>
    </form>
</div>
{% endblock %}
