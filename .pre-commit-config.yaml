repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # django-stubs imports project.settings at load time. Without these env
        # vars, settings.py's production secret-key guard raises ValueError and
        # mypy reports "Error constructing plugin instance" — see CLAUDE.md.
        entry: bash -c 'DJANGO_SETTINGS_MODULE=project.settings DJANGO_DEBUG=True DJANGO_SECRET_KEY=dummy-secret-key-for-static-analysis PYTHONPATH=project uv run mypy project/'
        language: system
        types: [python]
        pass_filenames: false

      - id: bandit
        name: bandit
        entry: bash -c "PYTHONUTF8=1 uv run bandit -r project/ -c pyproject.toml"
        language: system
        types: [python]
        pass_filenames: false

      # Runs the full pytest suite inside Docker and fails the commit if
      # coverage drops below 75%. Requires `make up` (containers running).
      # Pass --no-verify to git commit if you need to bypass (e.g. docker is
      # down), but CI will still enforce the same threshold.
      - id: pytest-coverage
        name: pytest coverage (>= 75%)
        entry: make test-cov-gate
        language: system
        pass_filenames: false
        stages: [pre-commit]
